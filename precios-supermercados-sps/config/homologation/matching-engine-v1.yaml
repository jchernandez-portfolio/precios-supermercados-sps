schema: precios-sps-matching-engine-config/v1
engine_version: matching-engine-v1
mode: shadow

# Blocking: unión de llaves deterministas + recuperación MinHash-LSH sobre
# n-gramas de caracteres del nombre núcleo; los vecinos se re-rankean por
# coseno TF-IDF y se conservan top-k por cadena contraria.
blocking:
  rules:
    - brand_size        # marca canónica + bucket logarítmico de tamaño (±1)
    - type_size         # tipo de producto + bucket de tamaño (±1)
    - brand_token       # marca + primer token significativo
    - lead_tokens       # dos primeros tokens significativos ordenados + dimensión
  max_block_size: 250
  size_bucket_log_step: 0.05
  minhash:
    num_perm: 48
    bands: 16
    shingle_size: 3
    max_bucket_size: 300
    seed: 20260930
  top_k_per_retailer: 6
  min_similarity: 0.15

comparison:
  name_levels: [0.88, 0.74, 0.60, 0.45]
  size:
    exact_relative: 0.005
    exact_absolute: 1.5
    close_relative: 0.02
    near_relative: 0.06
    ounce_bridge_relative: 0.03
  price_ratio_levels: [1.3, 2.0, 3.0]
  # Token "raro" (distintivo) si aparece en ≤ 0.5 % de los registros de la ciudad.
  rare_token_share: 0.005

model:
  laplace: 1.0
  u_random_pairs: 120000
  seed: 20260930
  em_iterations: 40
  # Ponderar etiquetas para que cada par de cadenas aporte lo mismo se evaluó
  # en el corte 2026-09-21: +2–3 pts de recall en pares con La Colonia/Colonial,
  # pero −1.5 pts de precisión en prueba y una banda de revisión 4× mayor.
  # Se mantiene la distribución observada.
  balance_retailer_pairs: false
  # El precio es evidencia débil: su peso absoluto queda acotado.
  weight_caps_bits:
    price: 1.0

thresholds:
  target_precision: 0.98
  min_support: 50
  # Criterio: límite inferior de Wilson (z = 1.645, 95 % unilateral) ≥ objetivo,
  # por par de supermercados. Evita elegir un umbral optimista por azar.
  confidence_z: 1.645
  # Banda de revisión: probabilidad mínima cuya precisión acumulada (silver,
  # calibración) siga ≥ review_min_precision; nunca por debajo del piso.
  review_min_precision: 0.5
  review_floor_probability: 0.05
  # Máximo de candidatos en cola por registro y cadena contraria.
  review_top_k_per_record: 2
  fallback_auto_probability: 0.995
  fallback_review_probability: 0.5

clustering:
  linkage: complete
  max_cluster_size: 8

# Atributos de variante por familia. Dos valores distintos de la misma familia
# son conflicto; un valor declarado de un solo lado limita la pareja a revisión,
# salvo los valores implícitos por defecto (``implicit_defaults``).
implicit_defaults:
  sugar_line: [original]
  fat: [whole]
  # El envase declarado de un solo lado es muy frecuente ("Lata", "Doypack");
  # sólo dos envases distintos declarados son conflicto.
  packaging: [can, bottle, bag, doypack, box, glass, tetra]

