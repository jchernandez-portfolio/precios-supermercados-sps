schema: precios-sps-product-identity-policy/v1
engine_version: product-homologation-v2.6

relations:
  identity:
    - EXACT_TRADE_ITEM
    - VERIFIED_EQUIVALENT
  non_identity:
    - PRODUCT_VARIANT
    - COMPARABLE_ALTERNATIVE
    - UNRESOLVED
    - CONFLICT

evidence_priority:
  - same_valid_gtin
  - manufacturer_catalog
  - barcode_visible
  - package_front
  - package_back
  - retailer_detail_page
  - explicit_unit_conversion
  - source_title

automatic_identity:
  allowed:
    - same_valid_gtin_without_material_conflict
  forbidden:
    - title_similarity_only
    - image_similarity_only
    - llm_assertion_only
    - one_brand_plus_type_plus_size

# GS1 Restricted Circulation Numbers: válidos por check digit pero no globales.
# Copia declarativa de precios_supermercados.gtin_policy (un test exige igualdad).
restricted_gtin:
  policy_version: gs1-restricted-circulation-v1
  rule: identity_only_within_shared_product_master
  gtin8_first_digits: ["0", "2"]
  gtin13_prefix_ranges:
    - {low: 20, high: 29, reason: rcn_upc_variable_measure}
    - {low: 40, high: 49, reason: rcn_upc_company_internal}
    - {low: 200, high: 299, reason: rcn_in_store}
    - {low: 980, high: 999, reason: coupon_or_refund}
  gtin14_indicators: ["9"]
  shared_product_masters:
    # Walmart y Paiz publican el mismo catálogo VTEX de Walmart Centroamérica.
    walmart_cam: [paiz, walmart]
  # La Colonia SPS/TGU comparten supermarket_id: nunca forman grupo consigo misma.
  # Colonial: ean derivado del sku GS1 válido (aprobado 2026-10-01).
  # Comisariato Los Andes: ean = code sin ceros + dígito de control GS1 (aprobado
  # 2026-10-01). En grupos exactos aplican además las guardas de marca, nombre y
  # tono/modelo (sku_gtin_brand_conflict, sku_gtin_name_disagreement,
  # model_number_conflict).
  sku_derived_gtin_supermarkets: [colonial, comisariato_los_andes]
  outside_master_status: review_required

hard_conflicts:
  - different_valid_gtin
  - brand_conflict
  - product_type_conflict
  - presentation_conflict
  - variant_conflict
  - flavor_conflict
  - packaging_conflict
  - bundle_vs_single_conflict

reviewed_equivalence:
  required:
    - current_source_fingerprints
    - explicit_master_product_id
    - evidence_codes
    - reviewer
    - reviewed_at_utc
    - rationale
  stale_when:
    - source_evidence_changes
    - engine_version_changes
    - policy_version_changes

publication:
  mode: shadow
  public_serving_allowed: false
  require_offline_precision_before_enable: true
