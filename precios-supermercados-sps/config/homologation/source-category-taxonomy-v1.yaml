# Propagación de tipo por hoja de categoría: si al menos ``min_agreement`` de
# los productos con tipo derivado del nombre comparten tipo dentro de una misma
# ruta (y hay ``min_support`` ejemplos), los productos sin tipo de esa ruta
# heredan el tipo. Es reproducible y se reporta en la salida para revisión.
leaf_propagation:
  min_support: 5
  min_agreement: 0.8
