name: Cloudflare controlled probe - Verify existing evidence

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID that produced the signed probe artifact
        required: true
        type: string
      source_run_attempt:
        description: Physical run attempt encoded in the signed receipt
        required: true
        default: "1"
        type: string
      source_commit_sha:
        description: Commit SHA encoded in the signed receipt
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/requests/cloudflare-evidence-verify-request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-controlled-probe-evidence-verify
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.request.outputs.allowed }}
      source_run_id: ${{ steps.request.outputs.source_run_id }}
      source_run_attempt: ${{ steps.request.outputs.source_run_attempt }}
      source_commit_sha: ${{ steps.request.outputs.source_commit_sha }}
      request_sequence: ${{ steps.request.outputs.request_sequence }}

    steps:
      - name: Validate push changed only the controlled marker
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERIFY_REQUEST_PATH: .github/workflows/requests/cloudflare-evidence-verify-request.json
        with:
          script: |
            const expected = process.env.VERIFY_REQUEST_PATH;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              per_page: 100,
            });
            const files = Array.isArray(commit.files) ? commit.files : [];
            if (
              files.length !== 1 ||
              files[0].filename !== expected ||
              files[0].status === 'removed'
            ) {
              core.setFailed('probe_verify_trigger_not_marker_only');
            }

      - name: Checkout immutable verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate request and resolve immutable source identity
        id: request
        env:
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DISPATCH_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          DISPATCH_SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
          VERIFY_REQUEST_PATH: .github/workflows/requests/cloudflare-evidence-verify-request.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected_run_id = "32551882793"
          expected_attempt = "1"
          expected_commit = "cc15edef22709911beb1d1b027ae4c9992da1944"
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          sequence = "manual"

          if event_name == "workflow_dispatch":
              run_id = os.environ.get("DISPATCH_SOURCE_RUN_ID", "")
              attempt = os.environ.get("DISPATCH_SOURCE_RUN_ATTEMPT", "")
              commit = os.environ.get("DISPATCH_SOURCE_COMMIT_SHA", "")
          elif event_name == "push":
              payload = json.loads(Path(os.environ["VERIFY_REQUEST_PATH"]).read_text(encoding="utf-8"))
              expected_keys = {
                  "schemaVersion",
                  "sourceRunId",
                  "sourceRunAttempt",
                  "sourceCommitSha",
                  "requestSequence",
                  "authority",
              }
              if not isinstance(payload, dict) or set(payload) != expected_keys:
                  raise SystemExit("probe_verify_request_schema_invalid")
              if payload.get("schemaVersion") != "precios-sps-cloudflare-evidence-verify-request/v1":
                  raise SystemExit("probe_verify_request_version_invalid")
              if payload.get("authority") is not False:
                  raise SystemExit("probe_verify_request_authority_must_be_false")
              request_sequence = payload.get("requestSequence")
              if type(request_sequence) is not int or not 1 <= request_sequence <= 999999:
                  raise SystemExit("probe_verify_request_sequence_invalid")
              sequence = str(request_sequence)
              run_id = str(payload.get("sourceRunId", ""))
              attempt = str(payload.get("sourceRunAttempt", ""))
              commit = str(payload.get("sourceCommitSha", ""))
              if (run_id, attempt, commit) != (
                  expected_run_id,
                  expected_attempt,
                  expected_commit,
              ):
                  raise SystemExit("probe_verify_request_source_not_allowlisted")
          else:
              raise SystemExit("probe_verify_request_event_invalid")

          if not re.fullmatch(r"[1-9][0-9]{0,19}", run_id):
              raise SystemExit("source_run_id_invalid")
          if not re.fullmatch(r"[1-9][0-9]{0,2}", attempt):
              raise SystemExit("source_run_attempt_invalid")
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("source_commit_sha_invalid")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("allowed=true\n")
              output.write(f"source_run_id={run_id}\n")
              output.write(f"source_run_attempt={attempt}\n")
              output.write(f"source_commit_sha={commit}\n")
              output.write(f"request_sequence={sequence}\n")
          PY

  verify-existing-evidence:
    needs: preflight
    if: ${{ needs.preflight.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-probe
    outputs:
      result: ${{ steps.reconcile.outputs.result }}
      error_code: ${{ steps.reconcile.outputs.error_code }}
    env:
      SOURCE_RUN_ID: ${{ needs.preflight.outputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ needs.preflight.outputs.source_run_attempt }}
      SOURCE_COMMIT_SHA: ${{ needs.preflight.outputs.source_commit_sha }}
      PROBE_PUBLIC_KEY_SPKI_B64URL: ${{ vars.CLOUDFLARE_PROBE_PUBLIC_KEY_SPKI_B64URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Locate verifier project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          matches = list(workspace.glob("*/src/precios_supermercados/cloudflare_controlled_probe_verifier.py"))
          if len(matches) != 1:
              raise SystemExit("Expected exactly one controlled-probe verifier project")
          project = matches[0].parents[2]
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"PROJECT_DIR={project}\n")
              env.write(f"PYTHONPATH={project / 'src'}\n")
          PY

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install verified dependencies
        shell: bash
        run: python -m pip install -r "$PROJECT_DIR/requirements.txt"

      - name: Download signed source artifact only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: precios-sps-cloudflare-controlled-probe
          path: .probe-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.source_run_id }}

      - name: Verify signature bytes and original physical identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from precios_supermercados.cloudflare_controlled_probe_verifier import verify_controlled_probe_artifact

          artifact = json.loads(Path(".probe-evidence/cloudflare-probe-result.json").read_text(encoding="utf-8"))
          verified = verify_controlled_probe_artifact(
              artifact,
              public_key_spki_b64url=os.environ["PROBE_PUBLIC_KEY_SPKI_B64URL"],
              expected_commit_sha=os.environ["SOURCE_COMMIT_SHA"],
              expected_run_id=os.environ["SOURCE_RUN_ID"],
              expected_run_attempt=int(os.environ["SOURCE_RUN_ATTEMPT"]),
          )
          if verified.production_authority is not False or verified.catalog_accepted is not False:
              raise SystemExit("controlled_probe_authority_invalid")
          PY

      - name: Reconcile existing physical fetch with Workers Observability
        id: reconcile
        env:
          PROBE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_PROBE_OBSERVABILITY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path

          from precios_supermercados.cloudflare_controlled_probe_events_query import (
              ControlledProbeEventsVerifierClient,
          )
          from precios_supermercados.cloudflare_controlled_probe_observability import (
              ControlledProbeObservabilityError,
          )
          from precios_supermercados.cloudflare_observability_http_transport import CloudflareObservabilityHttpTransport

          safe_code = re.compile(r"^[a-z0-9_.-]{1,128}$")
          output = Path(os.environ["GITHUB_OUTPUT"])

          def publish(result: str, error_code: str) -> None:
              if result not in {"ok", "error"} or not safe_code.fullmatch(error_code):
                  raise SystemExit("probe_verify_output_invalid")
              with output.open("a", encoding="utf-8") as handle:
                  handle.write(f"result={result}\n")
                  handle.write(f"error_code={error_code}\n")

          artifact = json.loads(Path(".probe-evidence/cloudflare-probe-result.json").read_text(encoding="utf-8"))
          verifier = ControlledProbeEventsVerifierClient(
              os.environ["CLOUDFLARE_ACCOUNT_ID"],
              CloudflareObservabilityHttpTransport(),
          )

          reconciled = None
          try:
              for query_attempt in range(1, 13):
                  try:
                      reconciled = verifier.reconcile_artifact(
                          artifact,
                          public_key_spki_b64url=os.environ["PROBE_PUBLIC_KEY_SPKI_B64URL"],
                          expected_commit_sha=os.environ["SOURCE_COMMIT_SHA"],
                          expected_run_id=os.environ["SOURCE_RUN_ID"],
                          expected_run_attempt=int(os.environ["SOURCE_RUN_ATTEMPT"]),
                          bearer_token=os.environ["PROBE_OBSERVABILITY_TOKEN"],
                      )
                      break
                  except ControlledProbeObservabilityError as exc:
                      if exc.code != "probe_discovery_trace_missing" or query_attempt == 12:
                          raise
                      print(f"Trace not ingested yet; telemetry query {query_attempt}/12 will retry.")
                      time.sleep(15)
          except ControlledProbeObservabilityError as exc:
              code = exc.code if isinstance(exc.code, str) and safe_code.fullmatch(exc.code) else "probe_observability_error"
              publish("error", code)
              raise SystemExit(code) from None
          except Exception:
              publish("error", "probe_observability_unexpected_error")
              raise SystemExit("probe_observability_unexpected_error") from None

          if reconciled is None:
              publish("error", "probe_observability_reconciliation_incomplete")
              raise SystemExit("probe_observability_reconciliation_incomplete")
          if reconciled.production_authority is not False or reconciled.catalog_accepted is not False:
              publish("error", "probe_observability_authority_invalid")
              raise SystemExit("probe_observability_authority_invalid")

          publish("ok", "none")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "## Existing controlled probe evidence — PASS\n\n"
              f"- Source run: `{os.environ['SOURCE_RUN_ID']}` / physical attempt `{os.environ['SOURCE_RUN_ATTEMPT']}`\n"
              f"- Source commit: `{os.environ['SOURCE_COMMIT_SHA']}`\n"
              f"- Trace ID: `{reconciled.trace_evidence.trace_id}`\n"
              f"- Fetch span: `{reconciled.trace_evidence.fetch_span_id}`\n"
              f"- Physical evidence ID: `{reconciled.physical_evidence_id}`\n"
              "- Cryptographic verification: **PASS**\n"
              "- Workers Observability reconciliation: **PASS**\n"
              "- `production_authority`: **false**\n"
              "- `catalog_accepted`: **false**\n",
              encoding="utf-8",
          )
          PY

  publish-status:
    needs:
      - preflight
      - verify-existing-evidence
    if: ${{ always() && needs.preflight.outputs.allowed == 'true' }}
    permissions:
      statuses: write
    runs-on: ubuntu-latest

    steps:
      - name: Publish sanitized verifier result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERIFY_JOB_RESULT: ${{ needs.verify-existing-evidence.result }}
          VERIFY_RESULT: ${{ needs.verify-existing-evidence.outputs.result }}
          VERIFY_ERROR_CODE: ${{ needs.verify-existing-evidence.outputs.error_code }}
        with:
          script: |
            const jobResult = process.env.VERIFY_JOB_RESULT;
            const verifierResult = process.env.VERIFY_RESULT;
            const rawCode = process.env.VERIFY_ERROR_CODE || 'probe_verifier_job_failed';
            const errorCode = /^[a-z0-9_.-]{1,128}$/.test(rawCode)
              ? rawCode.slice(0, 48)
              : 'probe_verifier_job_failed';
            const state = jobResult === 'success' && verifierResult === 'ok'
              ? 'success'
              : 'failure';
            const code = state === 'success' ? 'pass' : errorCode;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'precios-sps/cloudflare-evidence-verifier',
              description: `existing probe verifier: ${state}`,
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: `precios-sps/cloudflare-verifier-result/${code}`,
              description: `verifier diagnostic: ${code}`,
            });
