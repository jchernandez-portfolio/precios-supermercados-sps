name: Precios SPS - Operador productivo confiable

on:
  push:
    branches:
      - main
    paths:
      - precios-supermercados-sps/.automation/production-update-request.json
  schedule:
    - cron: "17 14 * * *" # 08:17 America/Tegucigalpa
    - cron: "17 18 * * *" # 12:17 America/Tegucigalpa

permissions:
  actions: write
  contents: read

concurrency:
  group: precios-sps-production-operator
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar revisión confiable exacta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar autorización acotada y solicitud cerrada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('precios-supermercados-sps/.automation/production-update-request.json')
          request = json.loads(path.read_text(encoding='utf-8'))
          expected_keys = {
              'schema',
              'request_id',
              'operation',
              'authorized_at_utc',
              'authorized_until_utc',
              'live_read_only_authorized',
              'production_persistence_authorized',
              'requested_ref',
          }
          if set(request) != expected_keys:
              raise SystemExit('production_request_schema_closed_set_mismatch')
          if request['schema'] != 'precios-sps-production-update-request/v1':
              raise SystemExit('production_request_schema_invalid')
          if request['operation'] != 'daily_all_productive_retailers':
              raise SystemExit('production_request_operation_invalid')
          if request['requested_ref'] != 'main':
              raise SystemExit('production_request_ref_invalid')
          if request['live_read_only_authorized'] is not True:
              raise SystemExit('production_request_live_authority_missing')
          if request['production_persistence_authorized'] is not True:
              raise SystemExit('production_request_persistence_authority_missing')
          if not isinstance(request['request_id'], str) or not re.fullmatch(r'[a-z0-9][a-z0-9._-]{7,79}', request['request_id']):
              raise SystemExit('production_request_id_invalid')

          def parse_utc(value: object, field: str) -> datetime:
              if not isinstance(value, str) or not value.endswith('Z'):
                  raise SystemExit(f'{field}_invalid')
              try:
                  parsed = datetime.fromisoformat(value.removesuffix('Z') + '+00:00')
              except ValueError as exc:
                  raise SystemExit(f'{field}_invalid') from exc
              if parsed.tzinfo != timezone.utc:
                  raise SystemExit(f'{field}_invalid')
              return parsed

          authorized_at = parse_utc(request['authorized_at_utc'], 'authorized_at_utc')
          authorized_until = parse_utc(request['authorized_until_utc'], 'authorized_until_utc')
          now = datetime.now(timezone.utc)
          if authorized_until <= authorized_at:
              raise SystemExit('production_request_authorization_window_invalid')
          if authorized_until - authorized_at > timedelta(hours=24):
              raise SystemExit('production_request_authorization_window_too_long')
          if now < authorized_at - timedelta(minutes=5) or now > authorized_until:
              raise SystemExit('production_request_authorization_not_current')
          print(json.dumps({
              'request_id': request['request_id'],
              'operation': request['operation'],
              'authorized_until_utc': request['authorized_until_utc'],
              'requested_ref': request['requested_ref'],
          }, sort_keys=True))
          PY

      - name: Despachar workflow productivo fijo en main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'precios-supermercados-sps-la-colonia-mvp-update.yml',
              ref: 'main',
              inputs: { live_read_only_authorized: 'true' },
            });

  recover:
    if: ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Arrancar el corte de hoy si falta o reintentar sólo sus jobs fallidos
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            const workflowId = 'precios-supermercados-sps-la-colonia-mvp-update.yml';
            const maxRunAttempt = 3;
            const retryableConclusions = new Set(['failure', 'timed_out']);
            const now = new Date();
            const hondurasNow = new Date(now.getTime() - 6 * 60 * 60 * 1000);
            const localYear = hondurasNow.getUTCFullYear();
            const localMonth = hondurasNow.getUTCMonth();
            const localDay = hondurasNow.getUTCDate();
            const dayStart = new Date(Date.UTC(localYear, localMonth, localDay, 6, 0, 0));
            const dayEnd = new Date(dayStart.getTime() + 24 * 60 * 60 * 1000);

            // El corte diario lo dispara el Worker de Cloudflare (workflow_dispatch,
            // 01:43); los cortes previos al 2026-10-09 eran event 'schedule'.
            const dailyEvents = new Set(['workflow_dispatch', 'schedule']);
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: 'main',
              per_page: 20,
            });
            const todaysRuns = response.data.workflow_runs
              .filter((run) => {
                const created = new Date(run.created_at);
                return dailyEvents.has(run.event) && run.conclusion !== 'cancelled' && created >= dayStart && created < dayEnd;
              })
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));

            if (todaysRuns.length === 0) {
              // Respaldo del disparo externo: sin corte hoy, se arranca ahora.
              core.info('daily_recovery_no_scheduled_run_today');
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref: 'main',
                inputs: { live_read_only_authorized: 'true' },
              });
              core.info('daily_recovery_dispatched_missing_run');
              return;
            }

            const run = todaysRuns[0];
            core.info(JSON.stringify({
              recovery_candidate_run_id: run.id,
              status: run.status,
              conclusion: run.conclusion,
              run_attempt: run.run_attempt,
              created_at: run.created_at,
            }));

            if (run.status !== 'completed') {
              core.info('daily_recovery_run_still_active');
              return;
            }
            if (run.conclusion === 'success') {
              core.info('daily_recovery_not_needed');
              return;
            }
            if (!retryableConclusions.has(run.conclusion)) {
              core.info(`daily_recovery_conclusion_not_retryable:${run.conclusion}`);
              return;
            }
            if (!Number.isInteger(run.run_attempt) || run.run_attempt < 1) {
              core.setFailed('daily_recovery_run_attempt_invalid');
              return;
            }
            if (run.run_attempt >= maxRunAttempt) {
              core.info(`daily_recovery_attempt_limit_reached:${run.run_attempt}`);
              return;
            }

            await github.rest.actions.reRunWorkflowFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            core.info(`daily_recovery_rerun_requested:${run.id}:next_attempt=${run.run_attempt + 1}`);
