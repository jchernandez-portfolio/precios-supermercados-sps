name: Precios SPS - Operador migración Turso confiable

on:
  push:
    branches:
      - main
    paths:
      - precios-supermercados-sps/.automation/turso-schema-migration-request.json

permissions:
  actions: write
  contents: read

concurrency:
  group: precios-sps-turso-schema-migration-operator
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar revisión confiable exacta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar autorización acotada y solicitud cerrada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('precios-supermercados-sps/.automation/turso-schema-migration-request.json')
          request = json.loads(path.read_text(encoding='utf-8'))
          expected_keys = {
              'schema',
              'request_id',
              'operation',
              'authorized_at_utc',
              'authorized_until_utc',
              'schema_migration_authorized',
              'requested_ref',
          }
          if set(request) != expected_keys:
              raise SystemExit('schema_migration_request_schema_closed_set_mismatch')
          if request['schema'] != 'precios-sps-turso-schema-migration-request/v1':
              raise SystemExit('schema_migration_request_schema_invalid')
          if request['operation'] != 'migrate_walmart_pricesmart_schema':
              raise SystemExit('schema_migration_request_operation_invalid')
          if request['requested_ref'] != 'main':
              raise SystemExit('schema_migration_request_ref_invalid')
          if request['schema_migration_authorized'] is not True:
              raise SystemExit('schema_migration_request_authority_missing')
          if not isinstance(request['request_id'], str) or not re.fullmatch(r'[a-z0-9][a-z0-9._-]{7,79}', request['request_id']):
              raise SystemExit('schema_migration_request_id_invalid')

          def parse_utc(value: object, field: str) -> datetime:
              if not isinstance(value, str) or not value.endswith('Z'):
                  raise SystemExit(f'{field}_invalid')
              try:
                  parsed = datetime.fromisoformat(value.removesuffix('Z') + '+00:00')
              except ValueError as exc:
                  raise SystemExit(f'{field}_invalid') from exc
              if parsed.tzinfo != timezone.utc:
                  raise SystemExit(f'{field}_invalid')
              return parsed

          authorized_at = parse_utc(request['authorized_at_utc'], 'authorized_at_utc')
          authorized_until = parse_utc(request['authorized_until_utc'], 'authorized_until_utc')
          now = datetime.now(timezone.utc)
          if authorized_until <= authorized_at:
              raise SystemExit('schema_migration_request_authorization_window_invalid')
          if authorized_until - authorized_at > timedelta(hours=24):
              raise SystemExit('schema_migration_request_authorization_window_too_long')
          if now < authorized_at - timedelta(minutes=5) or now > authorized_until:
              raise SystemExit('schema_migration_request_authorization_not_current')
          print(json.dumps({
              'request_id': request['request_id'],
              'operation': request['operation'],
              'authorized_until_utc': request['authorized_until_utc'],
              'requested_ref': request['requested_ref'],
          }, sort_keys=True))
          PY

      - name: Despachar migración fija en main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'precios-supermercados-sps-turso-schema-migration.yml',
              ref: 'main',
              inputs: { schema_migration_authorized: 'true' },
            });
