name: La Colonia - Recorrido live manual

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Etapa segura del recorrido
        required: true
        default: mvp_sample
        type: choice
        options:
          - mvp_sample
          - smoke
          - staged
          - full
      mvp_sample_size:
        description: SKUs máximos conservados en la muestra MVP
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
      mvp_read_only_authorized:
        description: Confirma autorización humana explícita vigente para esta muestra read-only SPS
        required: true
        default: false
        type: boolean
      page_size:
        description: Productos solicitados por página
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
          - "50"
      max_pages:
        description: Límite de páginas; 0 usa el valor del modo
        required: true
        default: "2"
        type: string
      max_products:
        description: Límite de productos; 0 desactiva este límite
        required: true
        default: "0"
        type: string
      delay_seconds:
        description: Pausa secuencial entre peticiones
        required: true
        default: "1.5"
        type: string
      profile:
        description: Baseline observa; validation aplica umbrales
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - validation
      max_missing_price_ratio:
        description: Umbral validado; vacío en baseline
        required: false
        default: ""
        type: string
      max_duplicate_sku_ratio:
        description: Umbral validado; vacío en baseline
        required: false
        default: ""
        type: string
      max_duplicate_product_ratio:
        description: Umbral validado; vacío en baseline
        required: false
        default: ""
        type: string
      max_total_change_ratio:
        description: Umbral validado; vacío en baseline
        required: false
        default: ""
        type: string
      allow_full:
        description: Confirmación manual adicional para el recorrido completo
        required: true
        default: false
        type: boolean
      facet_authorization_id:
        description: Autorización humana explícita para facets SPS; hoy no existe ninguna activa
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
    paths:
      - precios-supermercados-sps/.automation/la-colonia-mvp-live-request.json

permissions:
  contents: read

concurrency:
  group: la-colonia-live-catalog-crawl
  cancel-in-progress: false

jobs:
  mvp-sample:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'mvp_sample' && inputs.mvp_read_only_authorized == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: precios-supermercados-sps

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar autorización live vigente
        id: authorization
        shell: bash
        env:
          INPUT_MVP_SAMPLE_SIZE: ${{ inputs.mvp_sample_size }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$INPUT_MVP_SAMPLE_SIZE" in
              "5"|"10") ;;
              *) echo "sample_size manual inválido" >&2; exit 2 ;;
            esac
            echo "sample_size=$INPUT_MVP_SAMPLE_SIZE" >> "$GITHUB_OUTPUT"
            echo "capture_mode=passive" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              "schema_version": "precios-sps-la-colonia-full-catalog-request/v1",
              "authorization_mode": "one_time_full_catalog_after_staged_validation",
              "authorized_at_utc": "2026-08-25T21:13:44Z",
              "continued_at_utc": "2026-08-25T22:31:45Z",
              "authorization_source": "human_user_explicit_chat_instruction",
              "authorization_statement": "podes trabajar en obtener todo el catalogo",
              "continuation_statement": "ok comenza a trabajar",
              "active": False,
              "termination_condition": "first_successful_downloadable_full_sps_catalog",
              "attempt_sequence": 15,
              "trigger_pr_number": 312,
              "supermarket_id": "la_colonia",
              "location_id": "la_colonia_sps",
              "city": "San Pedro Sula",
              "mode": "operational_city_url_safe_brand_bucket_recovery_productSearchV3",
              "radiography_execution": False,
              "location_verification": "structural_exact_city_control",
              "page_size": 50,
              "max_planned_product_requests": 400,
              "delay_seconds": 1.5,
              "live_read_only": True,
              "same_browser_context": True,
              "max_city_control_reresolutions_per_attempt": 1,
              "commercial_retries_per_attempt": 0,
              "full_crawl": True,
              "google_sheets_writes": False,
              "commercial_persistence": False,
              "catalog_accepted": False,
              "production_authority": False,
              "extraction_enabled": False,
              "stop_conditions": [
                  "persistent_403",
                  "http_429",
                  "captcha",
                  "login_required",
                  "host_mismatch",
                  "city_selection_not_verified",
                  "brand_values_missing",
                  "brand_partition_exceeds_search_window",
                  "brand_bucket_outside_search_window",
                  "single_brand_url_too_long",
                  "brand_bucket_url_limit_exceeded",
                  "partition_request_budget_exceeded",
                  "partition_total_changed_mid_run",
                  "unexpected_product_page_overflow",
                  "partition_unique_product_coverage_mismatch",
                  "unique_product_coverage_mismatch",
                  "excessive_load_risk",
              ],
          }
          request_path = Path(".automation/la-colonia-mvp-live-request.json")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if request != expected:
              raise SystemExit("mvp_live_request_mismatch")

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          if event.get("ref") != "refs/heads/main":
              raise SystemExit("mvp_live_push_not_main")
          repository = event.get("repository") or {}
          if repository.get("full_name") != "jchernandez-portfolio/precios-supermercados-sps":
              raise SystemExit("mvp_live_repository_mismatch")

          # El one-shot terminó en el run 32922877781. Este push sólo verifica
          # que el marker consumido es exactamente el esperado y NO hace red.
          # mvp_live_merge_identity_mismatch queda como sentinel histórico de seguridad.
          # historical schema sentinel: precios-sps-la-colonia-mvp-live-request/v1
          # 2026-08-25T01:20:22Z / PR #277
          # Merge pull request #277 from
          # jchernandez-portfolio/feature/precios-sps-mvp-live-trigger
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("sample_size=10\n")
              output.write("capture_mode=consumed_no_network\n")
          PY

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r requirements.txt

      - name: Obtener datos SPS autorizados
        id: sample
        shell: bash
        env:
          INPUT_MVP_SAMPLE_SIZE: ${{ steps.authorization.outputs.sample_size }}
          CAPTURE_MODE: ${{ steps.authorization.outputs.capture_mode }}
        run: |
          set +e
          if [[ "$CAPTURE_MODE" == "passive" ]]; then
            python scripts/probar_muestra_sps_la_colonia.py \
              --live-read-only \
              --sample-size "$INPUT_MVP_SAMPLE_SIZE" \
              --output run-artifacts/mvp-sample.json
            exit_code=$?
          elif [[ "$CAPTURE_MODE" == "consumed_no_network" ]]; then
            echo "One-shot full catalog consumido; no se ejecuta tráfico live."
            exit_code=0
          else
            echo "capture_mode no autorizado" >&2
            exit_code=2
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar datos de la ejecución
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-sps-data-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Reflejar resultado de la ejecución
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.sample.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "El runner SPS no produjo código de salida." >&2
            exit 1
          fi
          exit "$exit_code"

  live-crawl:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: precios-supermercados-sps

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Ejecutar recorrido secuencial controlado
        id: crawl
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PAGE_SIZE: ${{ inputs.page_size }}
          INPUT_MAX_PAGES: ${{ inputs.max_pages }}
          INPUT_MAX_PRODUCTS: ${{ inputs.max_products }}
          INPUT_DELAY_SECONDS: ${{ inputs.delay_seconds }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_MAX_MISSING_PRICE_RATIO: ${{ inputs.max_missing_price_ratio }}
          INPUT_MAX_DUPLICATE_SKU_RATIO: ${{ inputs.max_duplicate_sku_ratio }}
          INPUT_MAX_DUPLICATE_PRODUCT_RATIO: ${{ inputs.max_duplicate_product_ratio }}
          INPUT_MAX_TOTAL_CHANGE_RATIO: ${{ inputs.max_total_change_ratio }}
          INPUT_ALLOW_FULL: ${{ inputs.allow_full }}
        run: |
          set +e
          args=(
            --mode "$INPUT_MODE"
            --page-size "$INPUT_PAGE_SIZE"
            --delay-seconds "$INPUT_DELAY_SECONDS"
            --profile "$INPUT_PROFILE"
            --output-dir run-artifacts
          )

          if [[ "$INPUT_MAX_PAGES" != "0" ]]; then args+=(--max-pages "$INPUT_MAX_PAGES"); fi
          if [[ "$INPUT_MAX_PRODUCTS" != "0" ]]; then args+=(--max-products "$INPUT_MAX_PRODUCTS"); fi
          if [[ -n "$INPUT_MAX_MISSING_PRICE_RATIO" ]]; then args+=(--max-missing-price-ratio "$INPUT_MAX_MISSING_PRICE_RATIO"); fi
          if [[ -n "$INPUT_MAX_DUPLICATE_SKU_RATIO" ]]; then args+=(--max-duplicate-sku-ratio "$INPUT_MAX_DUPLICATE_SKU_RATIO"); fi
          if [[ -n "$INPUT_MAX_TOTAL_CHANGE_RATIO" ]]; then args+=(--max-total-change-ratio "$INPUT_MAX_TOTAL_CHANGE_RATIO"); fi
          if [[ -n "$INPUT_MAX_DUPLICATE_PRODUCT_RATIO" ]]; then args+=(--max-duplicate-product-ratio "$INPUT_MAX_DUPLICATE_PRODUCT_RATIO"); fi
          if [[ "$INPUT_ALLOW_FULL" == "true" ]]; then args+=(--allow-full); fi

          python scripts/probar_la_colonia.py "${args[@]}"
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar informe sanitizado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-${{ inputs.mode }}-summary
          path: precios-supermercados-sps/run-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Construir comentario sanitizado
        if: always()
        continue-on-error: true
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PAGE_SIZE: ${{ inputs.page_size }}
          INPUT_MAX_PAGES: ${{ inputs.max_pages }}
          INPUT_MAX_PRODUCTS: ${{ inputs.max_products }}
          INPUT_DELAY_SECONDS: ${{ inputs.delay_seconds }}
          INPUT_PROFILE: ${{ inputs.profile }}
          RUNNER_EXIT_CODE: ${{ steps.crawl.outputs.exit_code }}
          ARTIFACT_NAME: la-colonia-${{ inputs.mode }}-summary
        run: >-
          python scripts/publicar_resultado_la_colonia.py
          --summary run-artifacts/run-summary.json
          --output run-artifacts/pr-comment.md

      - name: Reflejar aceptación real del recorrido
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.crawl.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then echo "El runner no produjo código de salida." >&2; exit 1; fi
          exit "$exit_code"

  context-bound-facet-entrypoint:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: la-colonia-live
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      CLOUDFLARE_EDGE_GATEWAY_URL: ${{ vars.CLOUDFLARE_EDGE_GATEWAY_URL }}
      CLOUDFLARE_EDGE_RECEIPT_PUBLIC_KEY_SPKI_B64URL: ${{ vars.CLOUDFLARE_EDGE_RECEIPT_PUBLIC_KEY_SPKI_B64URL }}

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Ejecutar entrypoint context-bound de facets
        id: facets
        shell: bash
        run: |
          set +e
          python precios-supermercados-sps/scripts/ejecutar_facets_context_bound_la_colonia.py \
            --authorization-id "${{ inputs.facet_authorization_id }}" \
            --output-dir precios-supermercados-sps/facet-entrypoint-artifacts
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar sólo evidencia sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: la-colonia-context-bound-facets-${{ github.run_id }}
          path: |
            precios-supermercados-sps/facet-entrypoint-artifacts/facet-entrypoint-status.json
            precios-supermercados-sps/facet-entrypoint-artifacts/facet-entrypoint-evidence.json
            precios-supermercados-sps/facet-entrypoint-artifacts/facet-discovery-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Reflejar resultado técnico
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.facets.outputs.exit_code }}"
          case "$exit_code" in
            "0"|"2") exit 0 ;;
            *) exit 1 ;;
          esac
