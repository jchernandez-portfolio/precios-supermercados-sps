name: Precios SPS - Cola de revisión de tamaños

# Después de cada refresco de homologación recalcula los grupos GTIN con tamaños
# en conflicto (sólo SELECT en Turso) y publica `cola.json` en la rama pública
# `revision-tamanos`, que lee el panel #/admin/revision. Sólo contiene datos ya
# públicos (cadena, nombre y tamaño publicados). Omite los GTIN ya decididos.
# Resolución por GTIN (Open Food Facts por defecto: gratis, sin llave): para lo que
# sigue en la cola (nunca el catálogo completo) busca el contenido neto del código
# exacto, sin leer fotos. Si coincide con lo que publica algún súper, se guarda solo
# (engine:off_auto, nunca sobre una decisión humana); lo demás queda con la nota de
# revisión humana. También re-audita lo que la IA resolvió con fotos: si la fuente dice
# otro tamaño, el código vuelve a la cola como «Corrección de IA». Con
# `web_proveedor=gemini` usa Gemini con Google Search (requiere un plan con búsqueda).
# Lo buscado va en `web-tamanos.json`.
# Lectura de fotos con Claude: sólo si se pide a mano (`ia_minutos` > 0); por defecto
# sólo aplica las lecturas guardadas. Cada llave de IA entra sólo a su paso; los
# secretos de Turso, sólo a los pasos de Turso.
on:
  workflow_run:
    workflows:
      - "Precios SPS - Refrescar homologación derivada"
    types:
      - completed
  workflow_dispatch:
    inputs:
      ia_minutos:
        description: "Minutos de lectura de fotos nuevas con Claude (0 = sólo aplicar lo guardado)"
        required: false
        default: "0"
        type: string
      claude_max:
        description: "Tope de lecturas de fotos con Claude por corrida (0 = no leer fotos nuevas)"
        required: false
        default: "200"
        type: string
      web_proveedor:
        description: "Fuente de la búsqueda por GTIN"
        required: false
        default: "off"
        type: choice
        options:
          - "off"
          - gemini
      web_max:
        description: "Búsquedas por GTIN para la cola (0 = sólo aplicar lo guardado)"
        required: false
        default: "40"
        type: string
      web_auditar:
        description: "Búsquedas para re-auditar lo que la IA resolvió con fotos (0 = no auditar)"
        required: false
        default: "20"
        type: string
      web_primero:
        description: "GTIN a buscar primero en la web, separados por coma (opcional)"
        required: false
        default: ""
        type: string
      fichas_gtin:
        description: "Prueba: ficha completa con Claude y búsqueda web para estos GTIN (coma; máx. 50; no guarda decisiones)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: precios-sps-size-queue
  cancel-in-progress: false

jobs:
  queue:
    if: >-
      ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}/source/precios-supermercados-sps/src
    steps:
      - name: Descargar código de main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Descargar rama de la cola sin ejecutar su contenido
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: revision-tamanos
          path: cola
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias fijadas
        run: python -m pip install --disable-pip-version-check requests==2.34.2 PyYAML==6.0.3 anthropic==2.4.0

      - name: Calcular cola (sólo lectura)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cola
          if [ -L cola/cola.json ]; then echo "cola_symlink_boundary_invalid:cola.json" >&2; exit 1; fi
          # Si el índice de fotos no responde, se reusan las fotos de la cola anterior.
          python source/precios-supermercados-sps/scripts/exportar_cola_tamanos.py --output-dir /tmp/cola \
            --previous-queue cola/cola.json

      - name: Lectura de fotos con IA (Claude)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IA_MINUTOS: ${{ inputs.ia_minutos || '0' }}
          CLAUDE_MAX: ${{ inputs.claude_max || '200' }}
        run: |
          set -euo pipefail
          case "$IA_MINUTOS" in (''|*[!0-9]*) echo "ia_minutos_invalido" >&2; exit 1;; esac
          case "$CLAUDE_MAX" in (''|*[!0-9]*) echo "claude_max_invalido" >&2; exit 1;; esac
          if [ "$IA_MINUTOS" -gt 120 ]; then IA_MINUTOS=120; fi
          if [ "$CLAUDE_MAX" -gt 2000 ]; then CLAUDE_MAX=2000; fi
          if [ -L cola/ia-tamanos.json ]; then echo "ia_cache_symlink_invalid" >&2; exit 1; fi
          cp /tmp/cola/cola.json /tmp/cola/cola-sin-ia.json
          if ! python source/precios-supermercados-sps/scripts/sugerir_tamanos_ia.py \
              --queue /tmp/cola/cola.json --cache-in cola/ia-tamanos.json \
              --cache-out /tmp/cola/ia-tamanos.json --minutes "$IA_MINUTOS" --claude-max "$CLAUDE_MAX" \
              --auto-out /tmp/cola/auto-decisiones.json --auto-out-claude /tmp/cola/auto-decisiones-claude.json \
              --queue-with-auto /tmp/cola/cola-con-auto.json; then
            cp /tmp/cola/cola-sin-ia.json /tmp/cola/cola.json
            rm -f /tmp/cola/auto-decisiones.json /tmp/cola/auto-decisiones-claude.json
            exit 1
          fi

      - name: Búsqueda por GTIN y auto-resolución
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEB_PROVEEDOR: ${{ inputs.web_proveedor || 'off' }}
          WEB_MAX: ${{ inputs.web_max || '40' }}
          WEB_AUDITAR: ${{ inputs.web_auditar || '20' }}
          WEB_PRIMERO: ${{ inputs.web_primero || '' }}
        run: |
          set -euo pipefail
          case "$WEB_MAX" in (''|*[!0-9]*) echo "web_max_invalido" >&2; exit 1;; esac
          case "$WEB_AUDITAR" in (''|*[!0-9]*) echo "web_auditar_invalido" >&2; exit 1;; esac
          if [ "$WEB_MAX" -gt 300 ]; then WEB_MAX=300; fi
          if [ "$WEB_AUDITAR" -gt 300 ]; then WEB_AUDITAR=300; fi
          case "$WEB_PRIMERO" in (*[!0-9,]*) echo "web_primero_invalido" >&2; exit 1;; esac
          case "$WEB_PROVEEDOR" in (off|gemini) ;; (*) echo "web_proveedor_invalido" >&2; exit 1;; esac
          if [ -L cola/web-tamanos.json ]; then echo "web_cache_symlink_invalid" >&2; exit 1; fi
          # Sólo los códigos de la cola y los ya resueltos por IA (nunca el catálogo).
          # Si falla, la cola sigue como estaba.
          cp /tmp/cola/cola.json /tmp/cola/cola-sin-web.json
          if [ -f /tmp/cola/cola-con-auto.json ]; then cp /tmp/cola/cola-con-auto.json /tmp/cola/cola-con-auto-sin-web.json; fi
          if ! python source/precios-supermercados-sps/scripts/buscar_tamanos_web.py --provider "$WEB_PROVEEDOR" \
              --queue /tmp/cola/cola.json --queue-with-auto /tmp/cola/cola-con-auto.json \
              --auto-out /tmp/cola/auto-decisiones-web.json --cache-in cola/web-tamanos.json \
              --cache-out /tmp/cola/web-tamanos.json --max "$WEB_MAX" --audit-max "$WEB_AUDITAR" \
              --minutes 60 --first "$WEB_PRIMERO"; then
            cp /tmp/cola/cola-sin-web.json /tmp/cola/cola.json
            if [ -f /tmp/cola/cola-con-auto-sin-web.json ]; then
              cp /tmp/cola/cola-con-auto-sin-web.json /tmp/cola/cola-con-auto.json
            else
              rm -f /tmp/cola/cola-con-auto.json
            fi
            rm -f /tmp/cola/web-tamanos.json /tmp/cola/auto-decisiones-web-gemini.json \
              /tmp/cola/auto-decisiones-web-claude.json /tmp/cola/auto-decisiones-web-off.json
            exit 1
          fi

      - name: Fichas de producto con Claude (prueba)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FICHAS_GTIN: ${{ inputs.fichas_gtin || '' }}
        run: |
          set -euo pipefail
          if [ -z "$FICHAS_GTIN" ]; then echo "sin_fichas"; exit 0; fi
          case "$FICHAS_GTIN" in (*[!0-9,]*) echo "fichas_gtin_invalido" >&2; exit 1;; esac
          # Sólo lectura: escribe fichas-prueba.json; no toca Turso ni la cola.
          python source/precios-supermercados-sps/scripts/fichas_producto_web.py \
            --queue /tmp/cola/cola-sin-ia.json --gtins "$FICHAS_GTIN" --output /tmp/cola/fichas-prueba.json

      - name: Guardar decisiones automáticas de la IA
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Cada archivo se guarda con el motor de quien leyó. Si alguno no se pudo
          # guardar, se publica la cola con esos códigos todavía adentro.
          saved_all=true
          for pair in "gemini_auto:auto-decisiones.json" "claude_auto:auto-decisiones-claude.json" \
              "gemini_auto:auto-decisiones-web-gemini.json" "claude_auto:auto-decisiones-web-claude.json" \
              "off_auto:auto-decisiones-web-off.json"; do
            engine="${pair%%:*}"; file="/tmp/cola/${pair#*:}"
            if [ ! -s "$file" ]; then echo "sin_decisiones_automaticas:$engine"; continue; fi
            if ! python source/precios-supermercados-sps/scripts/aplicar_decisiones_tamano.py --turso --apply \
                --engine "$engine" --payload-file "$file" \
                --summary "/tmp/cola/auto-resultado-$engine-${file##*/}"; then
              saved_all=false
            fi
          done
          if [ "$saved_all" != true ] && [ -f /tmp/cola/cola-con-auto.json ]; then
            cp /tmp/cola/cola-con-auto.json /tmp/cola/cola.json
            echo "decisiones_automaticas_no_guardadas" >&2
          fi

      - name: Publicar en un solo commit y push
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/cola"
          for name in cola.json ia-tamanos.json web-tamanos.json fichas-prueba.json; do
            if [ -L "$repository/$name" ]; then echo "cola_symlink_boundary_invalid:$name" >&2; exit 1; fi
          done
          # Sólo se publica si cambian los códigos o el resumen de la IA (no sólo la fecha).
          if python source/precios-supermercados-sps/scripts/comparar_cola.py \
              --anterior "$repository/cola.json" --nueva /tmp/cola/cola.json; then
            cp /tmp/cola/cola.json "$repository/cola.json"
          fi
          for name in ia-tamanos.json web-tamanos.json fichas-prueba.json; do
            if [ -f "/tmp/cola/$name" ]; then cp "/tmp/cola/$name" "$repository/$name"; fi
          done
          git -C "$repository" config user.name "github-actions[bot]"
          git -C "$repository" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repository" add -- cola.json
          for name in ia-tamanos.json web-tamanos.json fichas-prueba.json; do
            if [ -f "$repository/$name" ]; then git -C "$repository" add -- "$name"; fi
          done
          if git -C "$repository" diff --cached --quiet; then
            echo "cola_already_current=true"
            exit 0
          fi
          git -C "$repository" commit -q -m "data: cola de revisión de tamaños (run $SOURCE_RUN_ID)"
          git -C "$repository" push origin HEAD:revision-tamanos
