name: Precios SPS - Cola de revisión de tamaños

# Después de cada refresco de homologación recalcula los grupos GTIN con tamaños
# en conflicto (sólo SELECT en Turso) y publica `cola.json` en la rama pública
# `revision-tamanos`, que lee el panel #/admin/revision. Sólo contiene datos ya
# públicos (cadena, nombre y tamaño publicados). Omite los GTIN ya decididos.
# IA: Gemini lee el contenido neto en la foto de cada oferta (las mismas fotos del
# panel; sólo lo nuevo; lo leído se guarda en `ia-tamanos.json`). Si todas las fotos
# confirman el tamaño de la mayoría, la decisión se guarda sola (engine:gemini_auto,
# nunca sobre una humana) y el código sale de la cola. La llave GEMINI_API_KEY sólo
# entra al paso de lectura; los secretos de Turso, sólo a los pasos de Turso.
on:
  workflow_run:
    workflows:
      - "Precios SPS - Refrescar homologación derivada"
    types:
      - completed
  workflow_dispatch:
    inputs:
      ia_minutos:
        description: "Minutos máximos de consultas a Gemini (0 = sólo aplicar lo guardado)"
        required: false
        default: "25"
        type: string

permissions:
  contents: write

concurrency:
  group: precios-sps-size-queue
  cancel-in-progress: false

jobs:
  queue:
    if: >-
      ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}/source/precios-supermercados-sps/src
    steps:
      - name: Descargar código de main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Descargar rama de la cola sin ejecutar su contenido
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: revision-tamanos
          path: cola
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias fijadas
        run: python -m pip install --disable-pip-version-check requests==2.34.2 PyYAML==6.0.3

      - name: Calcular cola (sólo lectura)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cola
          python source/precios-supermercados-sps/scripts/exportar_cola_tamanos.py --output-dir /tmp/cola

      - name: Sugerencias de tamaño con IA (Gemini)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IA_MINUTOS: ${{ inputs.ia_minutos || '25' }}
        run: |
          set -euo pipefail
          case "$IA_MINUTOS" in (''|*[!0-9]*) echo "ia_minutos_invalido" >&2; exit 1;; esac
          if [ "$IA_MINUTOS" -gt 120 ]; then IA_MINUTOS=120; fi
          if [ -L cola/ia-tamanos.json ]; then echo "ia_cache_symlink_invalid" >&2; exit 1; fi
          cp /tmp/cola/cola.json /tmp/cola/cola-sin-ia.json
          if ! python source/precios-supermercados-sps/scripts/sugerir_tamanos_ia.py \
              --queue /tmp/cola/cola.json --cache-in cola/ia-tamanos.json \
              --cache-out /tmp/cola/ia-tamanos.json --minutes "$IA_MINUTOS" \
              --auto-out /tmp/cola/auto-decisiones.json --queue-with-auto /tmp/cola/cola-con-auto.json; then
            cp /tmp/cola/cola-sin-ia.json /tmp/cola/cola.json
            rm -f /tmp/cola/auto-decisiones.json
            exit 1
          fi

      - name: Guardar decisiones automáticas de la IA
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/cola/auto-decisiones.json ]; then echo "sin_decisiones_automaticas"; exit 0; fi
          # Si no se pudieron guardar, se publica la cola con esos códigos todavía adentro.
          if ! python source/precios-supermercados-sps/scripts/aplicar_decisiones_tamano.py --turso --apply \
              --engine gemini_auto --payload-file /tmp/cola/auto-decisiones.json \
              --summary /tmp/cola/auto-resultado.json; then
            cp /tmp/cola/cola-con-auto.json /tmp/cola/cola.json
            echo "decisiones_automaticas_no_guardadas" >&2
          fi

      - name: Publicar en un solo commit y push
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/cola"
          for name in cola.json ia-tamanos.json; do
            if [ -L "$repository/$name" ]; then echo "cola_symlink_boundary_invalid:$name" >&2; exit 1; fi
          done
          cp /tmp/cola/cola.json "$repository/cola.json"
          if [ -f /tmp/cola/ia-tamanos.json ]; then cp /tmp/cola/ia-tamanos.json "$repository/ia-tamanos.json"; fi
          git -C "$repository" config user.name "github-actions[bot]"
          git -C "$repository" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repository" add -- cola.json
          if [ -f "$repository/ia-tamanos.json" ]; then git -C "$repository" add -- ia-tamanos.json; fi
          if git -C "$repository" diff --cached --quiet; then
            echo "cola_already_current=true"
            exit 0
          fi
          git -C "$repository" commit -q -m "data: cola de revisión de tamaños (run $SOURCE_RUN_ID)"
          git -C "$repository" push origin HEAD:revision-tamanos
