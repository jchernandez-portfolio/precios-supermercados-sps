name: Precios SPS - Cola de revisión de tamaños

# Después de cada refresco de homologación recalcula los grupos GTIN con tamaños
# en conflicto (sólo SELECT en Turso) y publica `cola.json` en la rama pública
# `revision-tamanos`, que lee el panel #/admin/revision. Sólo contiene datos ya
# públicos (cadena, nombre y tamaño publicados). Omite los GTIN ya decididos.
# IA: Claude (si existe ANTHROPIC_API_KEY) y, de respaldo, Gemini leen el contenido
# neto en la foto de cada oferta (las mismas fotos del panel; sólo lo nuevo; lo leído
# se guarda en `ia-tamanos.json` con proveedor y modelo). Si Claude falla (crédito,
# llave, 429, 529) la corrida sigue con Gemini. Si todas las fotos confirman el tamaño
# de la mayoría, la decisión se guarda sola (engine:claude_auto o engine:gemini_auto,
# nunca sobre una humana) y el código sale de la cola. Las llaves de IA sólo entran
# al paso de lectura; los secretos de Turso, sólo a los pasos de Turso.
on:
  workflow_run:
    workflows:
      - "Precios SPS - Refrescar homologación derivada"
    types:
      - completed
  workflow_dispatch:
    inputs:
      ia_minutos:
        description: "Minutos máximos de consultas a la IA (0 = sólo aplicar lo guardado)"
        required: false
        default: "25"
        type: string
      claude_max:
        description: "Tope de consultas a Claude por corrida (0 = sólo Gemini)"
        required: false
        default: "200"
        type: string
      claude_model:
        description: "Modelo de Claude que lee las fotos"
        required: false
        default: claude-sonnet-5-5
        type: choice
        options:
          - claude-sonnet-5-5
          - claude-haiku-5-5

permissions:
  contents: write

concurrency:
  group: precios-sps-size-queue
  cancel-in-progress: false

jobs:
  queue:
    if: >-
      ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: ${{ github.workspace }}/source/precios-supermercados-sps/src
    steps:
      - name: Descargar código de main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Descargar rama de la cola sin ejecutar su contenido
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: revision-tamanos
          path: cola
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias fijadas
        run: python -m pip install --disable-pip-version-check requests==2.34.2 PyYAML==6.0.3

      - name: Calcular cola (sólo lectura)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cola
          python source/precios-supermercados-sps/scripts/exportar_cola_tamanos.py --output-dir /tmp/cola

      - name: Sugerencias de tamaño con IA (Claude, respaldo Gemini)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IA_MINUTOS: ${{ inputs.ia_minutos || '25' }}
          CLAUDE_MAX: ${{ inputs.claude_max || '200' }}
          CLAUDE_MODEL: ${{ inputs.claude_model || 'claude-sonnet-5-5' }}
        run: |
          set -euo pipefail
          case "$IA_MINUTOS" in (''|*[!0-9]*) echo "ia_minutos_invalido" >&2; exit 1;; esac
          case "$CLAUDE_MAX" in (''|*[!0-9]*) echo "claude_max_invalido" >&2; exit 1;; esac
          if [ "$IA_MINUTOS" -gt 120 ]; then IA_MINUTOS=120; fi
          if [ "$CLAUDE_MAX" -gt 2000 ]; then CLAUDE_MAX=2000; fi
          if [ -L cola/ia-tamanos.json ]; then echo "ia_cache_symlink_invalid" >&2; exit 1; fi
          cp /tmp/cola/cola.json /tmp/cola/cola-sin-ia.json
          if ! python source/precios-supermercados-sps/scripts/sugerir_tamanos_ia.py \
              --queue /tmp/cola/cola.json --cache-in cola/ia-tamanos.json \
              --cache-out /tmp/cola/ia-tamanos.json --minutes "$IA_MINUTOS" --claude-max "$CLAUDE_MAX" \
              --auto-out /tmp/cola/auto-decisiones.json --auto-out-claude /tmp/cola/auto-decisiones-claude.json \
              --queue-with-auto /tmp/cola/cola-con-auto.json; then
            cp /tmp/cola/cola-sin-ia.json /tmp/cola/cola.json
            rm -f /tmp/cola/auto-decisiones.json /tmp/cola/auto-decisiones-claude.json
            exit 1
          fi

      - name: Guardar decisiones automáticas de la IA
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Cada archivo se guarda con el motor de quien leyó. Si alguno no se pudo
          # guardar, se publica la cola con esos códigos todavía adentro.
          saved_all=true
          for pair in "gemini_auto:auto-decisiones.json" "claude_auto:auto-decisiones-claude.json"; do
            engine="${pair%%:*}"; file="/tmp/cola/${pair#*:}"
            if [ ! -s "$file" ]; then echo "sin_decisiones_automaticas:$engine"; continue; fi
            if ! python source/precios-supermercados-sps/scripts/aplicar_decisiones_tamano.py --turso --apply \
                --engine "$engine" --payload-file "$file" \
                --summary "/tmp/cola/auto-resultado-$engine.json"; then
              saved_all=false
            fi
          done
          if [ "$saved_all" != true ]; then
            cp /tmp/cola/cola-con-auto.json /tmp/cola/cola.json
            echo "decisiones_automaticas_no_guardadas" >&2
          fi

      - name: Publicar en un solo commit y push
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/cola"
          for name in cola.json ia-tamanos.json; do
            if [ -L "$repository/$name" ]; then echo "cola_symlink_boundary_invalid:$name" >&2; exit 1; fi
          done
          # Sólo se publica si cambian los códigos o el resumen de la IA (no sólo la fecha).
          if python source/precios-supermercados-sps/scripts/comparar_cola.py \
              --anterior "$repository/cola.json" --nueva /tmp/cola/cola.json; then
            cp /tmp/cola/cola.json "$repository/cola.json"
          fi
          if [ -f /tmp/cola/ia-tamanos.json ]; then cp /tmp/cola/ia-tamanos.json "$repository/ia-tamanos.json"; fi
          git -C "$repository" config user.name "github-actions[bot]"
          git -C "$repository" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repository" add -- cola.json
          if [ -f "$repository/ia-tamanos.json" ]; then git -C "$repository" add -- ia-tamanos.json; fi
          if git -C "$repository" diff --cached --quiet; then
            echo "cola_already_current=true"
            exit 0
          fi
          git -C "$repository" commit -q -m "data: cola de revisión de tamaños (run $SOURCE_RUN_ID)"
          git -C "$repository" push origin HEAD:revision-tamanos
