name: Precios SPS - Sincronizar datos estáticos del portafolio

on:
  workflow_run:
    workflows:
      - "Precios SPS - Publicar analítica segura"
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: precios-sps-portfolio-data-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar exactamente el artifact RPI ya generado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5.0.0
        with:
          name: safe-analytics-la-colonia-walmart-sps-${{ github.event.workflow_run.id }}
          path: /tmp/precios-sps-safe-analytics
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validar y materializar publicación RPI sin consultar Turso
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          artifact_root = Path('/tmp/precios-sps-safe-analytics')
          expected_scope = [
              {'supermarket_id': 'la_colonia', 'location_id': 'la_colonia_sps'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_sps'},
          ]
          expected_catalog_scope = [
              {'supermarket_id': 'la_colonia', 'location_id': 'la_colonia_sps'},
              {'supermarket_id': 'colonial', 'location_id': 'colonial_sps'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_sps'},
              {'supermarket_id': 'pricesmart', 'location_id': 'pricesmart_sps'},
              {'supermarket_id': 'comisariato_los_andes', 'location_id': 'comisariato_los_andes_sps'},
          ]
          expected_tgu_scope = [
              {'supermarket_id': 'la_colonia', 'location_id': 'la_colonia_tgu'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_tgu_ffaa'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_tgu_el_sauce'},
              {'supermarket_id': 'pricesmart', 'location_id': 'pricesmart_tgu'},
              {'supermarket_id': 'paiz', 'location_id': 'paiz_tgu_multiplaza'},
              {'supermarket_id': 'paiz', 'location_id': 'paiz_tgu_proceres'},
          ]
          policy = 'fail_closed_strong_identity_and_commercial_consistency'

          def only(filename: str, error_prefix: str) -> Path:
              matches = sorted(artifact_root.rglob(filename))
              if len(matches) != 1:
                  raise SystemExit(f'{error_prefix}_cardinality_invalid:{len(matches)}')
              return matches[0]

          def only_outside_catalogs(filename: str, error_prefix: str) -> Path:
              matches = sorted(
                  path for path in artifact_root.rglob(filename)
                  if path.parent.name not in {'consumer-v3', 'consumer-v3-tgu'}
              )
              if len(matches) != 1:
                  raise SystemExit(f'{error_prefix}_cardinality_invalid:{len(matches)}')
              return matches[0]

          consumer_path = only('consumer-mart.json', 'portfolio_sync_consumer')
          business_path = only('business-mart.json', 'portfolio_sync_business')
          manifest_path = only_outside_catalogs('manifest.json', 'portfolio_sync_manifest')
          sample_path = only('portfolio-sample.json', 'portfolio_sync_sample')
          catalog_manifests = sorted(
              path for path in artifact_root.rglob('manifest.json')
              if path.parent.name == 'consumer-v3'
          )
          tgu_catalog_manifests = sorted(
              path for path in artifact_root.rglob('manifest.json')
              if path.parent.name == 'consumer-v3-tgu'
          )
          if len(catalog_manifests) != 1:
              raise SystemExit(f'portfolio_sync_catalog_manifest_cardinality_invalid:{len(catalog_manifests)}')
          if len(tgu_catalog_manifests) != 1:
              raise SystemExit(f'portfolio_sync_tgu_catalog_manifest_cardinality_invalid:{len(tgu_catalog_manifests)}')
          catalog_manifest_path = catalog_manifests[0]
          tgu_manifest_path = tgu_catalog_manifests[0]

          consumer = json.loads(consumer_path.read_text(encoding='utf-8'))
          business = json.loads(business_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          sample = json.loads(sample_path.read_text(encoding='utf-8'))
          catalog_manifest = json.loads(catalog_manifest_path.read_text(encoding='utf-8'))
          tgu_manifest = json.loads(tgu_manifest_path.read_text(encoding='utf-8'))
          analysis_file = catalog_manifest.get('analysis_file')
          if analysis_file != 'analysis-sps.json':
              raise SystemExit('portfolio_sync_consumer_analysis_path_invalid')
          catalog_analysis = json.loads(
              (catalog_manifest_path.parent / analysis_file).read_text(encoding='utf-8')
          )

          if consumer.get('schema') != 'rpi-consumer-mart/v2':
              raise SystemExit('portfolio_sync_consumer_schema_invalid')
          if business.get('schema') != 'rpi-business-mart/v1':
              raise SystemExit('portfolio_sync_business_schema_invalid')
          if manifest.get('schema') != 'rpi-marts-manifest/v1':
              raise SystemExit('portfolio_sync_manifest_schema_invalid')
          if sample.get('schema') != 'precios-sps-safe-portfolio-sample/v1':
              raise SystemExit('portfolio_sync_sample_schema_invalid')
          if manifest.get('source_backend') != 'turso':
              raise SystemExit('portfolio_sync_backend_invalid')
          for current, expected, label in (
              (catalog_manifest, expected_catalog_scope, 'catalog'),
              (tgu_manifest, expected_tgu_scope, 'tgu_catalog'),
          ):
              if current.get('schema') != 'rpi-consumer-catalog-manifest/v3':
                  raise SystemExit(f'portfolio_sync_{label}_schema_invalid')
              if current.get('catalog_schema') != 'rpi-consumer-catalog/v3':
                  raise SystemExit(f'portfolio_sync_{label}_contract_invalid')
              if current.get('source_backend') != 'turso':
                  raise SystemExit(f'portfolio_sync_{label}_backend_invalid')
              if current.get('scope') != expected:
                  raise SystemExit(f'portfolio_sync_{label}_scope_invalid')
              if current.get('public_boundary') != {
                  'direct_turso_reads': 0,
                  'contains_business_mart': False,
                  'contains_raw': False,
                  'contains_review_queue': False,
              }:
                  raise SystemExit(f'portfolio_sync_{label}_boundary_invalid')
          if tgu_manifest.get('location') != {'city': 'Tegucigalpa', 'country_code': 'HN'}:
              raise SystemExit('portfolio_sync_tgu_city_invalid')
          if tgu_manifest.get('initial_files') != ['facets-tgu.json']:
              raise SystemExit('portfolio_sync_tgu_facets_contract_invalid')
          if (
              catalog_analysis.get('schema') != 'rpi-consumer-analysis/v1'
              or catalog_analysis.get('as_of') != catalog_manifest.get('as_of')
              or catalog_analysis.get('location') != {'city': 'San Pedro Sula', 'country_code': 'HN'}
              or catalog_analysis.get('summary', {}).get('visible_products') != catalog_manifest.get('visible_rows')
              or [item.get('supermarket_id') for item in catalog_analysis.get('retailers', [])]
                 != [item['supermarket_id'] for item in expected_catalog_scope]
              or catalog_analysis.get('methodology', {}).get('identity')
                 != 'only_persisted_ready_cross_retailer_identity'
          ):
              raise SystemExit('portfolio_sync_consumer_analysis_invalid')
          context_counts = tgu_manifest.get('context_offer_counts')
          if (
              not isinstance(context_counts, list)
              or len(context_counts) != len(expected_tgu_scope)
              or [
                  {'supermarket_id': item.get('supermarket_id'), 'location_id': item.get('location_id')}
                  for item in context_counts
              ] != expected_tgu_scope
              or any(type(item.get('offer_count')) is not int or item['offer_count'] <= 0 for item in context_counts)
          ):
              raise SystemExit('portfolio_sync_tgu_context_coverage_invalid')
          if manifest.get('business_schema') != business['schema'] or manifest.get('consumer_schema') != consumer['schema']:
              raise SystemExit('portfolio_sync_schema_crosscheck_invalid')

          for document, error in (
              (consumer, 'portfolio_sync_consumer_policy_invalid'),
              (business, 'portfolio_sync_business_policy_invalid'),
              (sample, 'portfolio_sync_sample_policy_invalid'),
          ):
              if document.get('comparison_policy') != policy:
                  raise SystemExit(error)
          if (
              consumer.get('comparison_status') != 'COMPARABLE'
              or business.get('comparison_status') != 'COMPARABLE'
              or manifest.get('comparison_status') != 'COMPARABLE'
          ):
              raise SystemExit('portfolio_sync_comparison_not_available')
          if (
              consumer.get('scope') != expected_scope
              or business.get('scope') != expected_scope
              or manifest.get('scope') != expected_scope
              or sample.get('scope') != expected_scope
          ):
              raise SystemExit('portfolio_sync_scope_invalid')

          products = consumer.get('products')
          rows = sample.get('rows')
          if not isinstance(products, list) or consumer.get('product_count') != len(products):
              raise SystemExit('portfolio_sync_product_count_invalid')
          if len(products) != manifest.get('safe_products') or not products:
              raise SystemExit('portfolio_sync_product_count_mismatch')
          offer_count = sum(
              len(product.get('offers', []))
              for product in products
              if isinstance(product, dict) and isinstance(product.get('offers'), list)
          )
          if offer_count != manifest.get('safe_offers'):
              raise SystemExit('portfolio_sync_offer_count_mismatch')
          if not isinstance(rows, list) or sample.get('row_count') != len(rows) or not (0 < len(rows) <= 10):
              raise SystemExit('portfolio_sync_sample_cardinality_invalid')
          if sample.get('source_schema') != consumer['schema'] or sample.get('source_as_of') != consumer.get('as_of'):
              raise SystemExit('portfolio_sync_sample_source_mismatch')

          hashes = manifest.get('files_sha256')
          if not isinstance(hashes, dict) or not hashes:
              raise SystemExit('portfolio_sync_hash_manifest_invalid')
          mart_root = manifest_path.parent
          for relative, expected_hash in hashes.items():
              relative_path = Path(relative)
              if relative_path.is_absolute() or '..' in relative_path.parts:
                  raise SystemExit('portfolio_sync_hash_path_invalid')
              path = mart_root / relative_path
              if not path.is_file():
                  raise SystemExit(f'portfolio_sync_hash_file_missing:{relative}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected_hash:
                  raise SystemExit(f'portfolio_sync_hash_mismatch:{relative}')
          if hashes.get('consumer-mart.json') != hashlib.sha256(consumer_path.read_bytes()).hexdigest():
              raise SystemExit('portfolio_sync_consumer_hash_mismatch')
          if hashes.get('business-mart.json') != hashlib.sha256(business_path.read_bytes()).hexdigest():
              raise SystemExit('portfolio_sync_business_hash_mismatch')

          def validate_catalog_files(public_root: Path, public_manifest: dict, prefix: str) -> None:
              files = public_manifest.get('files')
              if not isinstance(files, list) or not files:
                  raise SystemExit(f'{prefix}_files_invalid')
              if public_manifest.get('visible_rows', 0) <= 0 or public_manifest.get('partition_count', 0) <= 0:
                  raise SystemExit(f'{prefix}_empty')
              for item in files:
                  if not isinstance(item, dict):
                      raise SystemExit(f'{prefix}_file_invalid')
                  relative = Path(str(item.get('path', '')))
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'{prefix}_hash_path_invalid')
                  path = public_root / relative
                  if not path.is_file():
                      raise SystemExit(f'{prefix}_file_missing:{relative}')
                  if hashlib.sha256(path.read_bytes()).hexdigest() != item.get('sha256'):
                      raise SystemExit(f'{prefix}_hash_mismatch:{relative}')
                  if path.stat().st_size != item.get('bytes'):
                      raise SystemExit(f'{prefix}_size_mismatch:{relative}')

          catalog_root = catalog_manifest_path.parent
          tgu_root = tgu_manifest_path.parent
          validate_catalog_files(catalog_root, catalog_manifest, 'portfolio_sync_catalog')
          validate_catalog_files(tgu_root, tgu_manifest, 'portfolio_sync_tgu_catalog')

          retailer_counts = catalog_manifest.get('retailer_offer_counts')
          if (
              not isinstance(retailer_counts, dict)
              or set(retailer_counts) != {item['supermarket_id'] for item in expected_catalog_scope}
              or any(type(count) is not int or count <= 0 for count in retailer_counts.values())
          ):
              raise SystemExit('portfolio_sync_catalog_retailer_coverage_invalid')

          provenance = {
              'published_at_utc': os.environ['SOURCE_COMPLETED_AT'],
              'source_workflow_run_id': int(os.environ['SOURCE_RUN_ID']),
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
          }
          sample.update(provenance)

          serialized = json.dumps({
              'consumer': consumer,
              'manifest': manifest,
              'sample': sample,
              'catalog_manifest': catalog_manifest,
              'tgu_manifest': tgu_manifest,
              'catalog_analysis': catalog_analysis,
          }, ensure_ascii=False).casefold()
          serialized += '\n'.join(
              path.read_text(encoding='utf-8', errors='strict').casefold()
              for root in (catalog_root, tgu_root)
              for path in root.rglob('*.json')
          )
          for forbidden in ('turso_database_url', 'turso_auth_token', 'database_url', 'auth_token', 'libsql://'):
              if forbidden in serialized:
                  raise SystemExit(f'portfolio_sync_secret_material_detected:{forbidden}')

          consumer_target = Path('/tmp/precios-sps-rpi-consumer-mart.json')
          manifest_target = Path('/tmp/precios-sps-rpi-manifest.json')
          sample_target = Path('/tmp/precios-sps-portfolio-sample.json')
          catalog_target = Path('/tmp/precios-sps-rpi-v3')
          shutil.copyfile(consumer_path, consumer_target)
          shutil.copyfile(manifest_path, manifest_target)
          if catalog_target.exists():
              shutil.rmtree(catalog_target)
          shutil.copytree(catalog_root, catalog_target)
          tgu_target = catalog_target / 'cities' / 'tegucigalpa'
          tgu_target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(tgu_root, tgu_target)
          city_index = {
              'schema': 'rpi-consumer-city-index/v1',
              'default_city': 'san-pedro-sula',
              'cities': [
                  {
                      'slug': 'san-pedro-sula',
                      'name': 'San Pedro Sula',
                      'country_code': 'HN',
                      'manifest': 'manifest.json',
                      'store_count': len(expected_catalog_scope),
                  },
                  {
                      'slug': 'tegucigalpa',
                      'name': 'Tegucigalpa',
                      'country_code': 'HN',
                      'manifest': 'cities/tegucigalpa/manifest.json',
                      'store_count': len(expected_tgu_scope),
                  },
              ],
          }
          (catalog_target / 'cities.json').write_text(
              json.dumps(city_index, ensure_ascii=False, separators=(',', ':'), sort_keys=True) + '\n',
              encoding='utf-8',
          )
          sample_target.write_text(
              json.dumps(sample, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'consumer_schema': consumer['schema'],
              'safe_products': len(products),
              'safe_offers': offer_count,
              'sample_rows': sample['row_count'],
              'source_workflow_run_id': provenance['source_workflow_run_id'],
              'consumer_v3_visible_rows': catalog_manifest['visible_rows'],
              'consumer_v3_source_offers': catalog_manifest['source_offers'],
              'consumer_v3_partitions': catalog_manifest['partition_count'],
              'consumer_v3_comparable_products': catalog_analysis['summary']['comparable_products'],
              'consumer_v3_tgu_visible_rows': tgu_manifest['visible_rows'],
              'consumer_v3_tgu_source_offers': tgu_manifest['source_offers'],
              'consumer_v3_tgu_partitions': tgu_manifest['partition_count'],
          }, sort_keys=True))
          PY

      - name: Descargar rama de datos sin ejecutar su contenido
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: portfolio-data
          path: portfolio-data
          fetch-depth: 1

      - name: Actualizar proyección pública en un solo commit y push
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          repository="$GITHUB_WORKSPACE/portfolio-data"
          published="$repository/precios-supermercados-sps/published/rpi"
          sample="$repository/precios-supermercados-sps/portfolio/sample-data.json"

          python - <<'PY'
          from pathlib import Path
          import os

          repository = Path(os.environ['GITHUB_WORKSPACE']) / 'portfolio-data'
          targets = (
              repository / 'precios-supermercados-sps/published/rpi',
              repository / 'precios-supermercados-sps/portfolio',
          )
          for target in targets:
              current = target
              while current != repository:
                  if current.is_symlink():
                      raise SystemExit(f'portfolio_sync_symlink_boundary_invalid:{current.relative_to(repository)}')
                  current = current.parent
          PY

          rm -rf "$published/v3"
          mkdir -p "$published/v3" "$(dirname "$sample")"
          cp /tmp/precios-sps-rpi-consumer-mart.json "$published/consumer-mart.json"
          cp /tmp/precios-sps-rpi-manifest.json "$published/manifest.json"
          cp /tmp/precios-sps-portfolio-sample.json "$sample"
          cp -R /tmp/precios-sps-rpi-v3/. "$published/v3/"

          git -C "$repository" config user.name "github-actions[bot]"
          git -C "$repository" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$repository" add -A -- \
            precios-supermercados-sps/published/rpi \
            precios-supermercados-sps/portfolio/sample-data.json
          if git -C "$repository" diff --cached --quiet; then
            echo "portfolio_data_already_current=true"
            exit 0
          fi
          git -C "$repository" commit -m "data: publish RPI consumer contracts from run $SOURCE_RUN_ID"
          git -C "$repository" push origin HEAD:portfolio-data
