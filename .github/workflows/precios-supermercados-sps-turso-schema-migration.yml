name: Precios SPS - Migrar esquema Turso MVP

on:
  workflow_dispatch:
    inputs:
      schema_migration_authorized:
        description: Confirma autorización para migrar el esquema productivo Turso de forma transaccional
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: precios-sps-turso-schema-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' && inputs.schema_migration_authorized == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Migrar esquema Walmart y PriceSmart en Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/migrar_mvp_turso_walmart_pricesmart.py
