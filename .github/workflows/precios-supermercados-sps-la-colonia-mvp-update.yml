name: La Colonia - Actualización MVP

on:
  schedule:
    - cron: "43 7 * * *" # 01:43 America/Tegucigalpa
  workflow_dispatch:
    inputs:
      live_read_only_authorized:
        description: Confirma autorización humana vigente para consultas públicas read-only del MVP
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: la-colonia-mvp-update
  cancel-in-progress: false

jobs:
  acquire:
    if: ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' && (github.event_name == 'schedule' || inputs.live_read_only_authorized == true) }}
    strategy:
      fail-fast: false
      matrix:
        retailer:
          - la_colonia
          - los_andes
          - paiz
          - colonial
          - walmart
          - pricesmart
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r requirements.txt

      - name: Descargar y validar sólo este supermercado
        run: python scripts/ejecutar_adquisicion_diaria.py --retailer "${{ matrix.retailer }}"

      - name: Publicar handoff de adquisición
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: daily-acquisition-${{ matrix.retailer }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: precios-supermercados-sps/run-artifacts/
          if-no-files-found: warn
          retention-days: 14

  persist:
    needs: acquire
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: precios-supermercados-sps
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: python -m pip install -r requirements.txt

      - name: Descargar handoffs de todos los intentos del run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5.0.0
        with:
          pattern: daily-acquisition-*-${{ github.run_id }}-attempt-*
          path: precios-supermercados-sps/run-artifacts-handoffs
          merge-multiple: false

      - name: Ensamblar último handoff aceptado por supermercado
        run: |
          set -euo pipefail
          python scripts/ensamblar_adquisicion_diaria.py \
            --input run-artifacts-handoffs \
            --output run-artifacts \
            --run-id "$GITHUB_RUN_ID" \
            --evidence run-artifacts/acquisition-assembly.json

      - name: Aceptar sólo snapshots completos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_sqlite_la_colonia import validate_snapshot_bytes
          from actualizar_mvp_turso_comisariato_los_andes import validate_snapshot_bytes as validate_los_andes
          from actualizar_mvp_turso_paiz import validate_snapshot_bytes as validate_paiz

          for city in ('sps', 'tgu'):
              snapshot = validate_snapshot_bytes(Path(f'run-artifacts/{city}/full-catalog.json').read_bytes())
              assert snapshot['catalog_complete'] is True
              assert snapshot['location_verified_same_run'] is True

          los_andes = validate_los_andes(Path('run-artifacts/los-andes/full-catalog.json').read_bytes())
          assert los_andes['catalog_complete'] is True
          assert los_andes['location_verified_same_run'] is True
          assert los_andes['catalog_products_reported'] == los_andes['unique_products_extracted']

          for name in ('multiplaza', 'proceres'):
              snapshot = validate_paiz(Path(f'run-artifacts/paiz/snapshot-paiz-{name}.json').read_bytes())
              assert snapshot['catalog_complete'] is True
              assert snapshot['location_verified_same_run'] is True
              assert snapshot['catalog_products_reported'] == snapshot['unique_products_extracted']

          for path, supermarket in (
              ('run-artifacts/colonial/full-catalog.json', 'colonial'),
              ('run-artifacts/walmart/snapshot-walmart-sps.json', 'walmart'),
              ('run-artifacts/walmart/snapshot-walmart-tgu-ffaa.json', 'walmart'),
              ('run-artifacts/walmart/snapshot-walmart-tgu-el-sauce.json', 'walmart'),
              ('run-artifacts/pricesmart/snapshot-pricesmart-sps.json', 'pricesmart'),
              ('run-artifacts/pricesmart/snapshot-pricesmart-tgu.json', 'pricesmart'),
          ):
              snapshot = validate_snapshot_bytes(Path(path).read_bytes(), supermarket_id=supermarket)
              assert snapshot['catalog_complete'] is True
              assert snapshot['location_verified_same_run'] is True
              assert snapshot['catalog_products_reported'] == snapshot['unique_products_extracted']
          PY

      - name: Asegurar esquema Paiz en Turso
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/migrar_mvp_paiz.py --turso

      - name: Validar todos los destinos Turso antes de escribir
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/preflight_mvp_turso_daily.py \
            --artifact-root run-artifacts \
            --run-id "$GITHUB_RUN_ID" \
            | tee run-artifacts/turso-daily-preflight.json

      - name: Persistir La Colonia, Los Andes, Colonial, Walmart y PriceSmart
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          persist_generic() {
            local file="$1"
            local supermarket="$2"
            local suffix="$3"
            python scripts/actualizar_mvp_turso_la_colonia.py \
              "$file" \
              --supermarket "$supermarket" \
              --run-id "${GITHUB_RUN_ID}-${suffix}"
          }

          persist_generic run-artifacts/sps/full-catalog.json la_colonia sps
          persist_generic run-artifacts/tgu/full-catalog.json la_colonia tgu
          python scripts/actualizar_mvp_turso_comisariato_los_andes.py \
            run-artifacts/los-andes/full-catalog.json \
            --run-id "${GITHUB_RUN_ID}-los-andes"
          persist_generic run-artifacts/colonial/full-catalog.json colonial colonial
          persist_generic run-artifacts/walmart/snapshot-walmart-sps.json walmart walmart-sps
          persist_generic run-artifacts/walmart/snapshot-walmart-tgu-ffaa.json walmart walmart-tgu-ffaa
          persist_generic run-artifacts/walmart/snapshot-walmart-tgu-el-sauce.json walmart walmart-tgu-el-sauce
          persist_generic run-artifacts/pricesmart/snapshot-pricesmart-sps.json pricesmart pricesmart-sps
          persist_generic run-artifacts/pricesmart/snapshot-pricesmart-tgu.json pricesmart pricesmart-tgu

      - name: Persistir Paiz
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/actualizar_mvp_turso_paiz.py \
            run-artifacts/paiz/snapshot-paiz-multiplaza.json \
            --run-id "${GITHUB_RUN_ID}-paiz-multiplaza" \
            --verify
          python scripts/actualizar_mvp_turso_paiz.py \
            run-artifacts/paiz/snapshot-paiz-proceres.json \
            --run-id "${GITHUB_RUN_ID}-paiz-proceres" \
            --verify

      - name: Verificar commits exactos en Turso
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_sqlite_la_colonia import validate_snapshot_bytes
          from actualizar_mvp_turso_comisariato_los_andes import validate_snapshot_bytes as validate_los_andes
          from actualizar_mvp_turso_la_colonia import _execute_rows, _pipeline, _stmt

          expected_runs = []
          expected_open_by_location = []
          for city, supermarket_id, location_id in (
              ('sps', 'la_colonia', 'la_colonia_sps'),
              ('tgu', 'la_colonia', 'la_colonia_tgu'),
          ):
              raw = Path(f'run-artifacts/{city}/full-catalog.json').read_bytes()
              snapshot = validate_snapshot_bytes(raw)
              digest = hashlib.sha256(raw).hexdigest()
              expected_runs.append([
                  f"{os.environ['GITHUB_RUN_ID']}-{city}",
                  supermarket_id,
                  location_id,
                  'success',
                  snapshot['skus_extracted'],
                  snapshot['catalog_products_reported'],
                  digest,
              ])
              expected_open_by_location.append([location_id, snapshot['skus_extracted']])

          raw = Path('run-artifacts/los-andes/full-catalog.json').read_bytes()
          los_andes_snapshot = validate_los_andes(raw)
          digest = hashlib.sha256(raw).hexdigest()
          expected_runs.append([
              f"{os.environ['GITHUB_RUN_ID']}-los-andes",
              'comisariato_los_andes',
              'comisariato_los_andes_sps',
              'success',
              los_andes_snapshot['skus_extracted'],
              los_andes_snapshot['catalog_products_reported'],
              digest,
          ])
          expected_los_andes = [[
              'comisariato_los_andes',
              'comisariato_los_andes_sps',
              los_andes_snapshot['skus_extracted'],
          ]]
          expected_runs.sort()
          expected_open_by_location.sort()

          run_sql = '''SELECT scrape_run_id,supermarket_id,location_id,run_status,sku_count,catalog_product_count,source_json_sha256 FROM scrape_runs WHERE scrape_run_id IN (?,?,?) ORDER BY scrape_run_id'''
          run_args = (
              f"{os.environ['GITHUB_RUN_ID']}-sps",
              f"{os.environ['GITHUB_RUN_ID']}-tgu",
              f"{os.environ['GITHUB_RUN_ID']}-los-andes",
          )
          runs = []
          for attempt in range(7):
              data = _pipeline(
                  os.environ['TURSO_DATABASE_URL'],
                  os.environ['TURSO_AUTH_TOKEN'],
                  [{'type':'execute','stmt':_stmt(run_sql, run_args)}, {'type':'close'}],
              )
              runs = _execute_rows(data['results'][0])
              if runs == expected_runs:
                  break
              if attempt < 6:
                  time.sleep(20)
          if runs != expected_runs:
              raise SystemExit(f'commit_not_confirmed:expected={expected_runs}:actual={runs}')

          data = _pipeline(
              os.environ['TURSO_DATABASE_URL'],
              os.environ['TURSO_AUTH_TOKEN'],
              [
                  {'type':'execute','stmt':_stmt('''SELECT COUNT(*) FROM (SELECT supermarket_id,product_id,location_id FROM price_history WHERE ((supermarket_id=? AND location_id IN (?,?)) OR (supermarket_id=? AND location_id=?)) AND valid_to_utc IS NULL GROUP BY supermarket_id,product_id,location_id HAVING COUNT(*)>1)''', ('la_colonia','la_colonia_sps','la_colonia_tgu','comisariato_los_andes','comisariato_los_andes_sps'))},
                  {'type':'execute','stmt':_stmt('''SELECT location_id,COUNT(*) FROM price_history WHERE supermarket_id=? AND location_id IN (?,?) AND valid_to_utc IS NULL GROUP BY location_id ORDER BY location_id''', ('la_colonia','la_colonia_sps','la_colonia_tgu'))},
                  {'type':'execute','stmt':_stmt('''SELECT supermarket_id,location_id,COUNT(*) FROM price_history WHERE supermarket_id=? AND location_id=? AND valid_to_utc IS NULL GROUP BY supermarket_id,location_id''', ('comisariato_los_andes','comisariato_los_andes_sps'))},
                  {'type':'close'},
              ],
          )
          duplicates = _execute_rows(data['results'][0])
          open_by_location = _execute_rows(data['results'][1])
          los_andes_open = _execute_rows(data['results'][2])
          if duplicates != [[0]]:
              raise SystemExit(f'duplicate_open_periods:{duplicates}')
          if [row[0] for row in open_by_location] != [row[0] for row in expected_open_by_location]:
              raise SystemExit(f'current_location_mismatch:expected={expected_open_by_location}:actual={open_by_location}')
          if any(actual[1] < expected[1] for actual, expected in zip(open_by_location, expected_open_by_location, strict=True)):
              raise SystemExit(f'current_state_incomplete:minimum={expected_open_by_location}:actual={open_by_location}')
          if [row[:2] for row in los_andes_open] != [row[:2] for row in expected_los_andes]:
              raise SystemExit(f'los_andes_current_scope_mismatch:expected={expected_los_andes}:actual={los_andes_open}')
          if any(actual[2] < expected[2] for actual, expected in zip(los_andes_open, expected_los_andes, strict=True)):
              raise SystemExit(f'los_andes_current_state_incomplete:minimum={expected_los_andes}:actual={los_andes_open}')
          print(json.dumps({'runs': runs, 'open_by_location': open_by_location, 'los_andes_open': los_andes_open, 'duplicate_open_periods': 0}, ensure_ascii=False, sort_keys=True))
          PY

      - name: Verificar nuevos retailers y Paiz en Turso
        shell: bash
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from actualizar_mvp_sqlite_la_colonia import validate_snapshot_bytes
          from actualizar_mvp_turso_la_colonia import _execute_rows, _pipeline, _stmt
          from actualizar_mvp_turso_paiz import validate_snapshot_bytes as validate_paiz

          run_id = os.environ['GITHUB_RUN_ID']
          expected_runs = []
          expected_current = {}

          def add(path, supermarket, suffix, validator):
              raw = Path(path).read_bytes()
              snapshot = validator(raw)
              expected_runs.append([
                  f'{run_id}-{suffix}', supermarket, snapshot['location_id'], 'success',
                  snapshot['skus_extracted'], snapshot['catalog_products_reported'],
                  hashlib.sha256(raw).hexdigest(),
              ])
              expected_current[(supermarket, snapshot['location_id'])] = snapshot['skus_extracted']

          add('run-artifacts/paiz/snapshot-paiz-multiplaza.json', 'paiz', 'paiz-multiplaza', validate_paiz)
          add('run-artifacts/paiz/snapshot-paiz-proceres.json', 'paiz', 'paiz-proceres', validate_paiz)
          add('run-artifacts/colonial/full-catalog.json', 'colonial', 'colonial', lambda raw: validate_snapshot_bytes(raw, supermarket_id='colonial'))
          add('run-artifacts/walmart/snapshot-walmart-sps.json', 'walmart', 'walmart-sps', lambda raw: validate_snapshot_bytes(raw, supermarket_id='walmart'))
          add('run-artifacts/walmart/snapshot-walmart-tgu-ffaa.json', 'walmart', 'walmart-tgu-ffaa', lambda raw: validate_snapshot_bytes(raw, supermarket_id='walmart'))
          add('run-artifacts/walmart/snapshot-walmart-tgu-el-sauce.json', 'walmart', 'walmart-tgu-el-sauce', lambda raw: validate_snapshot_bytes(raw, supermarket_id='walmart'))
          add('run-artifacts/pricesmart/snapshot-pricesmart-sps.json', 'pricesmart', 'pricesmart-sps', lambda raw: validate_snapshot_bytes(raw, supermarket_id='pricesmart'))
          add('run-artifacts/pricesmart/snapshot-pricesmart-tgu.json', 'pricesmart', 'pricesmart-tgu', lambda raw: validate_snapshot_bytes(raw, supermarket_id='pricesmart'))
          expected_runs.sort()

          run_ids = [row[0] for row in expected_runs]
          placeholders = ','.join('?' for _ in run_ids)
          run_sql = f'''SELECT scrape_run_id,supermarket_id,location_id,run_status,sku_count,catalog_product_count,source_json_sha256 FROM scrape_runs WHERE scrape_run_id IN ({placeholders}) ORDER BY scrape_run_id'''
          runs = []
          for attempt in range(7):
              data = _pipeline(
                  os.environ['TURSO_DATABASE_URL'], os.environ['TURSO_AUTH_TOKEN'],
                  [{'type':'execute','stmt':_stmt(run_sql, tuple(run_ids))}, {'type':'close'}],
              )
              runs = _execute_rows(data['results'][0])
              if runs == expected_runs:
                  break
              if attempt < 6:
                  time.sleep(20)
          if runs != expected_runs:
              raise SystemExit(f'new_retailer_commits_not_confirmed:expected={expected_runs}:actual={runs}')

          pairs = sorted(expected_current)
          scope_sql = ' OR '.join('(supermarket_id=? AND location_id=?)' for _ in pairs)
          scope_args = tuple(value for pair in pairs for value in pair)
          data = _pipeline(
              os.environ['TURSO_DATABASE_URL'], os.environ['TURSO_AUTH_TOKEN'],
              [
                  {'type':'execute','stmt':_stmt(f'''SELECT supermarket_id,location_id,COUNT(*) FROM price_history WHERE valid_to_utc IS NULL AND ({scope_sql}) GROUP BY supermarket_id,location_id ORDER BY supermarket_id,location_id''', scope_args)},
                  {'type':'execute','stmt':_stmt(f'''SELECT COUNT(*) FROM (SELECT supermarket_id,product_id,location_id FROM price_history WHERE valid_to_utc IS NULL AND ({scope_sql}) GROUP BY supermarket_id,product_id,location_id HAVING COUNT(*)>1)''', scope_args)},
                  {'type':'execute','stmt':_stmt('SELECT COUNT(*) FROM pragma_foreign_key_check')},
                  {'type':'execute','stmt':_stmt('PRAGMA integrity_check')},
                  {'type':'close'},
              ],
          )
          current_rows = _execute_rows(data['results'][0])
          duplicates = _execute_rows(data['results'][1])
          foreign_keys = _execute_rows(data['results'][2])
          integrity = _execute_rows(data['results'][3])
          actual_current = {(row[0], row[1]): row[2] for row in current_rows}
          if set(actual_current) != set(expected_current):
              raise SystemExit(f'new_retailer_scope_missing:expected={sorted(expected_current)}:actual={sorted(actual_current)}')
          incomplete = {
              f'{key[0]}:{key[1]}': (expected_current[key], actual_current[key])
              for key in expected_current if actual_current[key] < expected_current[key]
          }
          if incomplete:
              raise SystemExit(f'new_retailer_current_state_incomplete:{incomplete}')
          if duplicates != [[0]] or foreign_keys != [[0]] or integrity != [['ok']]:
              raise SystemExit(f'new_retailer_integrity_failed:{duplicates}:{foreign_keys}:{integrity}')
          print(json.dumps({'runs': runs, 'current_open_by_location': current_rows, 'duplicate_open_periods': 0, 'foreign_key_violations': 0, 'integrity_check': 'ok'}, ensure_ascii=False, sort_keys=True))
          PY

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: supermercados-mvp-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: precios-supermercados-sps/run-artifacts/
          if-no-files-found: warn
          retention-days: 14
