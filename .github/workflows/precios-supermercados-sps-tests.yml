name: Precios Supermercados SPS - Pruebas base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/precios-supermercados-sps-tests.yml"
  push:
    branches:
      - main
    paths:
      - "precios-supermercados-sps/**"
      - ".github/workflows/precios-supermercados-sps-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    name: rpi-tests
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      # Las capturas crudas grandes viven en un GitHub Release (reports/evidencia-archivada.json);
      # las pruebas que las usan las bajan y comprueban su SHA-256.
      PRECIOS_SPS_EVIDENCIA: descargar

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Verificar consistencia de dependencias instaladas
        run: python -m pip check

      - name: Compilar src y scripts sin SyntaxWarning
        run: python -W error::SyntaxWarning -m compileall precios-supermercados-sps/src precios-supermercados-sps/scripts

      - name: Lint de Python (ruff, configurado en pyproject.toml)
        run: python -m ruff check precios-supermercados-sps

      - name: Lint de JavaScript (Biome fijado, configurado en biome.json)
        working-directory: precios-supermercados-sps
        run: npx --yes @biomejs/biome@2.3.5 lint

      - name: Ejecutar suite completa
        run: pytest precios-supermercados-sps/tests
