name: Precios SPS - Publicar analítica segura

on:
  workflow_run:
    workflows:
      - "Precios SPS - Refrescar homologación derivada"
    types:
      - completed
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "precios-supermercados-sps/.automation/rpi-publication-request.json"

permissions:
  contents: read

concurrency:
  group: precios-sps-safe-analytics-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Descargar revisión exacta de homologación
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validar solicitud controlada de publicación
        if: ${{ github.event_name == 'push' }}
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.automation/rpi-publication-request.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          expected_scope = [
              {'supermarket_id': 'la_colonia', 'location_id': 'la_colonia_sps'},
              {'supermarket_id': 'colonial', 'location_id': 'colonial_sps'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_sps'},
              {'supermarket_id': 'pricesmart', 'location_id': 'pricesmart_sps'},
              {'supermarket_id': 'comisariato_los_andes', 'location_id': 'comisariato_los_andes_sps'},
          ]
          expected_keys = {'schema', 'action', 'scope', 'read_only', 'reason', 'sequence'}
          if set(document) != expected_keys:
              raise SystemExit('rpi_publication_request_schema_closed_set_mismatch')
          if document.get('schema') != 'precios-sps-rpi-publication-request/v1':
              raise SystemExit('rpi_publication_request_schema_invalid')
          if document.get('action') != 'publish_safe_rpi':
              raise SystemExit('rpi_publication_request_action_invalid')
          if document.get('scope') != expected_scope:
              raise SystemExit('rpi_publication_request_scope_invalid')
          if document.get('read_only') is not True:
              raise SystemExit('rpi_publication_request_read_only_required')
          if document.get('reason') not in {'bootstrap_rpi_consumer_publication', 'operator_requested_republication'}:
              raise SystemExit('rpi_publication_request_reason_invalid')
          if type(document.get('sequence')) is not int or document['sequence'] < 1:
              raise SystemExit('rpi_publication_request_sequence_invalid')
          print(json.dumps({
              'request_schema': document['schema'],
              'action': document['action'],
              'sequence': document['sequence'],
              'read_only': document['read_only'],
          }, sort_keys=True))
          PY

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias verificadas
        run: |
          set -euo pipefail
          python -m pip install -r precios-supermercados-sps/requirements.txt
          python -m pip check

      - name: Exportar RPI seguro La Colonia vs Walmart SPS
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          rm -rf run-artifacts/analytics/rpi-la-colonia-walmart-sps
          mkdir -p run-artifacts/analytics
          python scripts/exportar_rpi_marts.py \
            --turso \
            --scope la_colonia=la_colonia_sps \
            --scope walmart=walmart_sps \
            --output-directory run-artifacts/analytics/rpi-la-colonia-walmart-sps \
            --require-products \
            | tee run-artifacts/analytics/rpi-la-colonia-walmart-sps-run.json

      - name: Exportar catálogo público B2C de cinco supermercados SPS
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          python scripts/exportar_consumer_catalog.py \
            --turso \
            --scope la_colonia=la_colonia_sps \
            --scope colonial=colonial_sps \
            --scope walmart=walmart_sps \
            --scope pricesmart=pricesmart_sps \
            --scope comisariato_los_andes=comisariato_los_andes_sps \
            --output-directory run-artifacts/analytics/rpi-la-colonia-walmart-sps/consumer-v3 \
            --require-products \
            | tee run-artifacts/analytics/rpi-consumer-v3-run.json

      - name: Exportar catálogo público B2C de Tegucigalpa por sucursal exacta
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          python scripts/exportar_consumer_catalog_tgu.py \
            --turso \
            --output-directory run-artifacts/analytics/rpi-la-colonia-walmart-sps/consumer-v3-tgu \
            --require-products \
            | tee run-artifacts/analytics/rpi-consumer-v3-tgu-run.json

      - name: Generar muestra segura para portafolio desde Consumer Mart
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          python scripts/generar_muestra_portafolio_segura.py \
            --consumer-mart run-artifacts/analytics/rpi-la-colonia-walmart-sps/consumer-mart.json \
            --output run-artifacts/analytics/rpi-la-colonia-walmart-sps/portfolio-sample.json \
            --limit 10 \
            | tee run-artifacts/analytics/rpi-la-colonia-walmart-sps-portfolio-run.json

      - name: Validar contrato RPI publicado
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('run-artifacts/analytics/rpi-la-colonia-walmart-sps')
          business = json.loads((root / 'business-mart.json').read_text(encoding='utf-8'))
          consumer = json.loads((root / 'consumer-mart.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          sample = json.loads((root / 'portfolio-sample.json').read_text(encoding='utf-8'))
          catalog_root = root / 'consumer-v3'
          catalog_manifest = json.loads((catalog_root / 'manifest.json').read_text(encoding='utf-8'))
          catalog_analysis = json.loads((catalog_root / 'analysis-sps.json').read_text(encoding='utf-8'))
          tgu_root = root / 'consumer-v3-tgu'
          tgu_manifest = json.loads((tgu_root / 'manifest.json').read_text(encoding='utf-8'))
          policy = 'fail_closed_strong_identity_and_commercial_consistency'
          expected_scope = [
              {'supermarket_id': 'la_colonia', 'location_id': 'la_colonia_sps'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_sps'},
          ]
          expected_catalog_scope = [
              {'supermarket_id': 'la_colonia', 'location_id': 'la_colonia_sps'},
              {'supermarket_id': 'colonial', 'location_id': 'colonial_sps'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_sps'},
              {'supermarket_id': 'pricesmart', 'location_id': 'pricesmart_sps'},
              {'supermarket_id': 'comisariato_los_andes', 'location_id': 'comisariato_los_andes_sps'},
          ]
          expected_tgu_scope = [
              {'supermarket_id': 'la_colonia', 'location_id': 'la_colonia_tgu'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_tgu_ffaa'},
              {'supermarket_id': 'walmart', 'location_id': 'walmart_tgu_el_sauce'},
              {'supermarket_id': 'pricesmart', 'location_id': 'pricesmart_tgu'},
              {'supermarket_id': 'paiz', 'location_id': 'paiz_tgu_multiplaza'},
              {'supermarket_id': 'paiz', 'location_id': 'paiz_tgu_proceres'},
          ]

          assert business['schema'] == 'rpi-business-mart/v1'
          assert consumer['schema'] == 'rpi-consumer-mart/v2'
          assert manifest['schema'] == 'rpi-marts-manifest/v1'
          assert sample['schema'] == 'precios-sps-safe-portfolio-sample/v1'
          assert manifest['source_backend'] == 'turso'
          assert manifest['business_schema'] == business['schema']
          assert manifest['consumer_schema'] == consumer['schema']
          for document in (business, consumer, sample):
              assert document['comparison_policy'] == policy
          assert business['comparison_status'] == 'COMPARABLE'
          assert consumer['comparison_status'] == 'COMPARABLE'
          assert manifest['comparison_status'] == 'COMPARABLE'
          assert business['scope'] == expected_scope
          assert consumer['scope'] == expected_scope
          assert manifest['scope'] == expected_scope
          assert sample['scope'] == expected_scope
          assert consumer['product_count'] == manifest['safe_products'] > 0
          offer_count = sum(len(product['offers']) for product in consumer['products'])
          assert offer_count == manifest['safe_offers']
          assert sample['row_count'] == len(sample['rows'])
          assert 0 < sample['row_count'] <= min(10, manifest['safe_products'])
          assert sample.get('source_schema') == consumer['schema']
          assert sample.get('source_as_of') == consumer['as_of']

          assert catalog_manifest['schema'] == 'rpi-consumer-catalog-manifest/v3'
          assert catalog_manifest['catalog_schema'] == 'rpi-consumer-catalog/v3'
          assert catalog_manifest['source_backend'] == 'turso'
          assert catalog_manifest['scope'] == expected_catalog_scope
          assert catalog_manifest['visible_rows'] > 0
          assert catalog_manifest['source_offers'] >= catalog_manifest['visible_rows']
          assert set(catalog_manifest['retailer_offer_counts']) == {item['supermarket_id'] for item in expected_catalog_scope}
          assert all(count > 0 for count in catalog_manifest['retailer_offer_counts'].values())
          assert catalog_manifest['partition_count'] > 0
          assert catalog_manifest['analysis_file'] == 'analysis-sps.json'
          assert catalog_analysis['schema'] == 'rpi-consumer-analysis/v1'
          assert catalog_analysis['as_of'] == catalog_manifest['as_of']
          assert catalog_analysis['location'] == {'city': 'San Pedro Sula', 'country_code': 'HN'}
          assert [item['supermarket_id'] for item in catalog_analysis['retailers']] == [
              item['supermarket_id'] for item in expected_catalog_scope
          ]
          assert catalog_analysis['summary']['visible_products'] == catalog_manifest['visible_rows']
          assert catalog_analysis['methodology']['identity'] == 'only_persisted_ready_cross_retailer_identity'
          assert catalog_manifest['public_boundary'] == {
              'direct_turso_reads': 0,
              'contains_business_mart': False,
              'contains_raw': False,
              'contains_review_queue': False,
          }

          assert tgu_manifest['schema'] == 'rpi-consumer-catalog-manifest/v3'
          assert tgu_manifest['catalog_schema'] == 'rpi-consumer-catalog/v3'
          assert tgu_manifest['source_backend'] == 'turso'
          assert tgu_manifest['location'] == {'city': 'Tegucigalpa', 'country_code': 'HN'}
          assert tgu_manifest['scope'] == expected_tgu_scope
          assert tgu_manifest['visible_rows'] > 0
          assert tgu_manifest['source_offers'] >= tgu_manifest['visible_rows']
          assert tgu_manifest['initial_files'] == ['facets-tgu.json']
          assert tgu_manifest['public_boundary'] == catalog_manifest['public_boundary']
          exact_counts = tgu_manifest.get('context_offer_counts')
          assert isinstance(exact_counts, list) and len(exact_counts) == len(expected_tgu_scope)
          assert [
              {'supermarket_id': item['supermarket_id'], 'location_id': item['location_id']}
              for item in exact_counts
          ] == expected_tgu_scope
          assert all(item['offer_count'] > 0 for item in exact_counts)
          assert len({item['name'] for item in tgu_manifest['retailers']}) == 6

          for public_root, public_manifest in ((catalog_root, catalog_manifest), (tgu_root, tgu_manifest)):
              public_files = public_manifest.get('files')
              assert isinstance(public_files, list) and public_files
              assert public_manifest['initial_payload']['request_count'] == 2
              for item in public_files:
                  relative = Path(item['path'])
                  assert not relative.is_absolute() and '..' not in relative.parts
                  path = public_root / relative
                  assert path.is_file(), relative
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
                  assert path.stat().st_size == item['bytes'] > 0

          hashes = manifest.get('files_sha256')
          assert isinstance(hashes, dict) and hashes
          for relative, expected_hash in hashes.items():
              relative_path = Path(relative)
              assert not relative_path.is_absolute() and '..' not in relative_path.parts
              path = root / relative_path
              assert path.is_file(), relative
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == expected_hash, relative
          assert 'consumer-mart.json' in hashes
          assert 'business-mart.json' in hashes
          assert 'business/fact_price_history.csv' in hashes
          assert 'business/fact_promotion_analysis.csv' in hashes

          serialized = '\n'.join(
              path.read_text(encoding='utf-8', errors='strict')
              for path in root.rglob('*')
              if path.is_file()
          ).casefold()
          for forbidden in ('turso_database_url', 'turso_auth_token', 'database_url', 'auth_token', 'libsql://'):
              assert forbidden not in serialized

          print(json.dumps({
              'safe_products': manifest['safe_products'],
              'safe_offers': manifest['safe_offers'],
              'comparison_status': manifest['comparison_status'],
              'portfolio_sample_rows': sample['row_count'],
              'business_fact_price_history_rows': len(business['facts']['fact_price_history']),
              'business_fact_promotion_rows': len(business['facts']['fact_promotion_analysis']),
              'consumer_v3_visible_rows': catalog_manifest['visible_rows'],
              'consumer_v3_source_offers': catalog_manifest['source_offers'],
              'consumer_v3_partitions': catalog_manifest['partition_count'],
              'consumer_v3_comparable_products': catalog_analysis['summary']['comparable_products'],
              'consumer_v3_tgu_visible_rows': tgu_manifest['visible_rows'],
              'consumer_v3_tgu_source_offers': tgu_manifest['source_offers'],
              'consumer_v3_tgu_partitions': tgu_manifest['partition_count'],
          }, sort_keys=True))
          PY

      - name: Publicar artifact RPI seguro
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: safe-analytics-la-colonia-walmart-sps-${{ github.run_id }}
          path: |
            precios-supermercados-sps/run-artifacts/analytics/rpi-la-colonia-walmart-sps/
            precios-supermercados-sps/run-artifacts/analytics/rpi-la-colonia-walmart-sps-run.json
            precios-supermercados-sps/run-artifacts/analytics/rpi-la-colonia-walmart-sps-portfolio-run.json
            precios-supermercados-sps/run-artifacts/analytics/rpi-consumer-v3-run.json
            precios-supermercados-sps/run-artifacts/analytics/rpi-consumer-v3-tgu-run.json
          if-no-files-found: warn
          retention-days: 30
