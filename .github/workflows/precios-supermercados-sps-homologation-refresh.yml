name: Precios SPS - Refrescar homologación derivada

on:
  push:
    branches:
      - main
    paths:
      - "precios-supermercados-sps/.automation/product-identity-persistence-request.json"
  workflow_run:
    workflows:
      - "La Colonia - Actualización MVP"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: precios-sps-homologation-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validar solicitud cerrada de persistencia derivada
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          document = json.loads(
              Path('.automation/product-identity-persistence-request.json').read_text(
                  encoding='utf-8'
              )
          )
          expected = {
              'schema', 'action', 'normalization_version',
              'source_tables_read_only', 'derived_write', 'reason', 'sequence',
          }
          if set(document) != expected:
              raise SystemExit('product_identity_persistence_request_closed_set_mismatch')
          if document['schema'] != 'precios-sps-product-identity-persistence-request/v1':
              raise SystemExit('product_identity_persistence_request_schema_invalid')
          if document['action'] != 'apply_audited_product_identity_v23':
              raise SystemExit('product_identity_persistence_request_action_invalid')
          if document['normalization_version'] != 'product-homologation-v2.3':
              raise SystemExit('product_identity_persistence_request_version_invalid')
          if document['source_tables_read_only'] is not True:
              raise SystemExit('product_identity_persistence_source_read_only_required')
          if document['derived_write'] is not True:
              raise SystemExit('product_identity_persistence_derived_write_required')
          if document['reason'] != 'audited_identity_v23_rollout':
              raise SystemExit('product_identity_persistence_reason_invalid')
          if type(document['sequence']) is not int or document['sequence'] < 1:
              raise SystemExit('product_identity_persistence_sequence_invalid')
          print(json.dumps({
              'schema': document['schema'],
              'normalization_version': document['normalization_version'],
              'sequence': document['sequence'],
          }, sort_keys=True))
          PY

      - name: Validar plan de perfiles derivados
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          mkdir -p run-artifacts/homologation
          python scripts/evaluar_identidad_productos.py \
            --output run-artifacts/homologation/identity-evaluation.json
          # Optimización Turso: el plan --dry-run relee products y perfiles
          # completos. En el refresco diario (workflow_run) el paso --apply ya es
          # fail-closed, así que el plan remoto sólo corre en ejecuciones manuales
          # o por solicitud.
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            python scripts/backfill_homologacion_turso.py \
              --updated-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --dry-run \
              | tee run-artifacts/homologation/daily-refresh-plan.json
          fi

      - name: Refrescar perfiles derivados
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          python scripts/backfill_homologacion_turso.py \
            --updated-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --apply \
            | tee run-artifacts/homologation/daily-refresh.json

      - name: Generar cola privada de revisión
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: precios-supermercados-sps
        run: |
          set -euo pipefail
          python scripts/exportar_revision_homologacion.py \
            --output run-artifacts/homologation/review-queue.json \
            | tee run-artifacts/homologation/review-export.json

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: product-homologation-refresh-${{ github.run_id }}
          path: precios-supermercados-sps/run-artifacts/homologation/
          if-no-files-found: warn
          retention-days: 14
