name: Precios SPS - Primera carga BigQuery

on:
  workflow_dispatch:
    inputs:
      apply_initial_snapshot:
        description: "Confirma la primera carga durable del snapshot inicial aprobado"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  first-load:
    if: >-
      ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' &&
          github.ref == 'refs/heads/main' &&
          inputs.apply_initial_snapshot == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      SOURCE_ARTIFACT_ID: "9655225996"
      EXPECTED_ARTIFACT_DIGEST: "0427e88be27df89fd9fcb50ed600ef5c6aef64177bfba92b4af3d2e25756a892"
      EXPECTED_JSON_SHA256: "2780eeffa5ef62f2d1c8c2c8365e88da1ca0006622d2f7b1c3529f834c9b5e50"
      GCP_PROJECT_ID: ${{ vars.PRECIOS_SPS_GCP_PROJECT_ID }}
      BIGQUERY_DATASET_ID: ${{ vars.PRECIOS_SPS_BIGQUERY_DATASET_ID }}
      GCP_WIF_PROVIDER: ${{ vars.PRECIOS_SPS_GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.PRECIOS_SPS_GCP_SERVICE_ACCOUNT }}
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar configuración obligatoria
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID BIGQUERY_DATASET_ID GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "missing_required_configuration:${name}" >&2
              exit 1
            fi
          done

          if [[ ! "$BIGQUERY_DATASET_ID" =~ ^[A-Za-z_][A-Za-z0-9_]{0,1023}$ ]]; then
            echo "bigquery_dataset_id_invalid" >&2
            exit 1
          fi

      - name: Descargar snapshot preservado exacto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/precios-sps-initial-snapshot"
          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/precios-sps-initial-snapshot/source-artifact.zip"

          printf '%s  %s\n' \
            "$EXPECTED_ARTIFACT_DIGEST" \
            "$RUNNER_TEMP/precios-sps-initial-snapshot/source-artifact.zip" \
            | sha256sum --check --strict

          unzip -q \
            "$RUNNER_TEMP/precios-sps-initial-snapshot/source-artifact.zip" \
            -d "$RUNNER_TEMP/precios-sps-initial-snapshot/data"

          actual_files="$(find "$RUNNER_TEMP/precios-sps-initial-snapshot/data" -maxdepth 1 -type f -printf '%f\n' | sort)"
          expected_files="$(printf '%s\n' full-catalog.csv full-catalog.json | sort)"
          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "snapshot_artifact_file_set_mismatch" >&2
            exit 1
          fi

          printf '%s  %s\n' \
            "$EXPECTED_JSON_SHA256" \
            "$RUNNER_TEMP/precios-sps-initial-snapshot/data/full-catalog.json" \
            | sha256sum --check --strict

      - name: Autenticar en Google Cloud sin llave persistente
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.PRECIOS_SPS_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.PRECIOS_SPS_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PRECIOS_SPS_GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Verificar consistencia de dependencias instaladas
        run: python -m pip check

      - name: Ejecutar primera carga durable y reconciliar
        shell: bash
        run: |
          set -euo pipefail
          python precios-supermercados-sps/scripts/cargar_snapshot_inicial_bigquery.py \
            --snapshot-json "$RUNNER_TEMP/precios-sps-initial-snapshot/data/full-catalog.json" \
            --project-id "$GCP_PROJECT_ID" \
            --dataset-id "$BIGQUERY_DATASET_ID" \
            --apply
