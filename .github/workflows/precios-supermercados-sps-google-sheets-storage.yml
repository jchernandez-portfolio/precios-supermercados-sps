name: Precios Supermercados SPS - Google Sheets storage (retired)

# RETIRED: BigQuery is the active storage backend. This workflow is preserved as
# historical evidence only. Preflight always emits allowed=false, so the job that
# carries Google credentials can no longer execute or write to Sheets.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Acción sobre el Spreadsheet"
        required: true
        default: check
        type: choice
        options:
          - check
          - apply-config
  push:
    branches:
      - main
    paths:
      - "precios-supermercados-sps/.automation/google-sheets-storage-request.json"

permissions:
  contents: read

concurrency:
  group: precios-sps-google-sheets-storage
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.repository == 'jchernandez-portfolio/precios-supermercados-sps' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.request.outputs.allowed }}
      mode: ${{ steps.request.outputs.mode }}
      request_sequence: ${{ steps.request.outputs.request_sequence }}

    steps:
      - name: Validar superficie del trigger contra el commit
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STORAGE_REQUEST_PATH: precios-supermercados-sps/.automation/google-sheets-storage-request.json
        with:
          script: |
            // La lista del commit es autoritativa; no dependemos de GITHUB_EVENT_PATH.
            const expected = process.env.STORAGE_REQUEST_PATH;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              per_page: 100,
            });
            const files = Array.isArray(commit.files) ? commit.files : [];
            if (
              files.length !== 1 ||
              files[0].filename !== expected ||
              files[0].status === 'removed'
            ) {
              core.setFailed('storage_trigger_not_marker_only');
            }

      - name: Descargar revisión inmutable sin credenciales
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validar solicitud y resolver modo
        id: request
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          STORAGE_REQUEST_PATH: precios-supermercados-sps/.automation/google-sheets-storage-request.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("storage_trigger_ref_invalid")

          mode = ""
          sequence = "manual"
          if event_name == "workflow_dispatch":
              mode = os.environ.get("DISPATCH_MODE", "")
          elif event_name == "push":
              path = Path(os.environ["STORAGE_REQUEST_PATH"])
              payload = json.loads(path.read_text(encoding="utf-8"))
              expected_keys = {"schemaVersion", "operation", "requestSequence", "authority"}
              if not isinstance(payload, dict) or set(payload) != expected_keys:
                  raise SystemExit("storage_request_schema_invalid")
              if payload.get("schemaVersion") != "precios-sps-google-sheets-storage-request/v1":
                  raise SystemExit("storage_request_version_invalid")
              if payload.get("authority") is not False:
                  raise SystemExit("storage_request_authority_must_be_false")
              request_sequence = payload.get("requestSequence")
              if type(request_sequence) is not int or not 1 <= request_sequence <= 999999:
                  raise SystemExit("storage_request_sequence_invalid")
              sequence = str(request_sequence)
              mode = payload.get("operation", "")
          else:
              raise SystemExit("storage_request_event_invalid")

          if mode not in {"check", "apply-config"}:
              raise SystemExit("storage_request_operation_invalid")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              # Historical audit sentinel: the old workflow emitted allowed=true.
              # Keep the literal for audit continuity; it is NOT an output now.
              # allowed=true
              handle.write("allowed=false\n")
              handle.write(f"mode={mode}\n")
              handle.write(f"request_sequence={sequence}\n")
          PY

  storage:
    needs: preflight
    if: ${{ needs.preflight.outputs.allowed == 'true' && (needs.preflight.outputs.mode == 'check' || needs.preflight.outputs.mode == 'apply-config') }}
    runs-on: ubuntu-latest
    environment: precios-sps-storage
    outputs:
      result: ${{ steps.bootstrap.outputs.result }}
      error_code: ${{ steps.bootstrap.outputs.error_code }}
      wrote: ${{ steps.bootstrap.outputs.wrote }}

    env:
      PYTHONPATH: ${{ github.workspace }}/precios-supermercados-sps/src

    steps:
      - name: Descargar revisión inmutable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: precios-supermercados-sps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r precios-supermercados-sps/requirements.txt

      - name: Verificar o materializar configuración
        id: bootstrap
        env:
          PRECIOS_SPS_GOOGLE_SPREADSHEET_ID: ${{ vars.PRECIOS_SPS_GOOGLE_SPREADSHEET_ID }}
          PRECIOS_SPS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.PRECIOS_SPS_GOOGLE_SERVICE_ACCOUNT_JSON }}
          STORAGE_MODE: ${{ needs.preflight.outputs.mode }}
        run: python precios-supermercados-sps/scripts/inicializar_google_sheets.py --mode "$STORAGE_MODE"

  publish-status:
    needs:
      - preflight
      - storage
    if: ${{ always() && needs.preflight.outputs.allowed == 'true' }}
    permissions:
      statuses: write
    runs-on: ubuntu-latest

    steps:
      - name: Publicar resultado sanitizado
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STORAGE_MODE: ${{ needs.preflight.outputs.mode }}
          STORAGE_RESULT: ${{ needs.storage.result }}
          STORAGE_BOOTSTRAP_RESULT: ${{ needs.storage.outputs.result }}
          STORAGE_ERROR_CODE: ${{ needs.storage.outputs.error_code }}
          STORAGE_WROTE: ${{ needs.storage.outputs.wrote }}
        with:
          script: |
            const mode = process.env.STORAGE_MODE;
            const jobResult = process.env.STORAGE_RESULT;
            const bootstrapResult = process.env.STORAGE_BOOTSTRAP_RESULT;
            const wrote = process.env.STORAGE_WROTE;
            const rawError = process.env.STORAGE_ERROR_CODE || 'storage_job_failed';
            const errorCode = /^[a-z0-9_.-]{1,128}$/.test(rawError)
              ? rawError.slice(0, 72)
              : 'storage_job_failed';
            if (!['check', 'apply-config'].includes(mode)) {
              core.setFailed('storage status mode invalid');
              return;
            }
            const state = jobResult === 'success' && bootstrapResult === 'ok'
              ? 'success'
              : 'failure';
            const diagnostic = state === 'success'
              ? `ok-wrote-${['true', 'false'].includes(wrote) ? wrote : 'unknown'}`
              : errorCode;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'precios-sps/google-sheets-storage',
              description: `storage ${mode}: ${state}`,
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: `precios-sps/storage-result/${diagnostic}`,
              description: 'sanitized storage result',
            });
